<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>溶接番号付番ソフト（Web版）</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://unpkg.com/@pdf-lib/fontkit@1.1.1/dist/fontkit.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/wawoff2@2.0.1/build/decompress_binding.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin:0; padding:0; height:100%;
    background:#2b2b2b; color:#ddd;
    font-family:"Meiryo","Hiragino Sans",sans-serif;
    overflow:hidden;
  }
  #app { display:flex; flex-direction:column; height:100vh; }

  /* ツールバーは指定した行数（1〜3列、デフォルト2列）に収まるよう折り返し、
     それでも入りきらない分は縦スクロール（スライド）で見えるようにする。
     行数は #toolbarRowsSelect で切り替え、JSがmax-heightを計算して適用する。 */
  .toolbar {
    background:#3c3c3c; padding:6px 8px; display:flex; align-items:flex-start; align-content:flex-start;
    flex-wrap:wrap; gap:4px; row-gap:4px; border-bottom:1px solid #222;
    overflow-x:hidden; overflow-y:auto; flex-shrink:0;
  }
  /* 関連するボタン類を1つの箱にまとめて視認性を上げるためのグループ枠 */
  .tgroup {
    display:flex; align-items:center; gap:4px; flex-shrink:0;
    background:#474747; padding:4px 6px; border-radius:6px;
  }
  /* ドラッグ＆ドロップで並び替え可能な単位（グループ＋区切り線）。
     種類ごとに個人で好きな位置へ移動でき、並び順はブラウザに保存される */
  .dndItem {
    display:flex; align-items:center; flex-shrink:0;
    border-radius:6px; transition:background .12s; position:relative;
  }
  /* 移動先の目印はまっすぐな縦棒「|」にする。box-shadow(inset)だと角丸に沿って
     【のような形になってしまうため、角丸の影響を受けない疑似要素で描画する */
  .dndItem.dragOverBefore::before,
  .dndItem.dragOverAfter::after {
    content:"";
    position:absolute;
    top:2px; bottom:2px;
    width:3px;
    border-radius:2px;
    background:#3fae7a;
  }
  .dndItem.dragOverBefore::before { left:-4px; }
  .dndItem.dragOverAfter::after  { right:-4px; }
  /* 並び替え専用のつまみ。ここをドラッグした時だけタブが移動する
     （スライダー等の操作部品とドラッグ操作が競合しないようにするため） */
  .dndHandle {
    cursor:grab; color:#888; font-size:12px; padding:0 4px 0 2px;
    flex-shrink:0; user-select:none; line-height:1; touch-action:none;
  }
  .dndHandle:active { cursor:grabbing; }
  .dndItem.dragging { opacity:.35; }
  .stylebar {
    background:#333; padding:5px 10px; display:flex; align-items:center;
    gap:10px; border-bottom:1px solid #222; font-size:12px; color:#ccc;
    flex-wrap:nowrap; overflow-x:auto; overflow-y:hidden; flex-shrink:0;
  }
  .sep { width:1px; height:24px; background:#666; margin:0 6px; flex-shrink:0; }

  /* 指定行数に入りきらない分は縦スクロールで見えるよう、細めのスクロールバーを表示する */
  .toolbar::-webkit-scrollbar, .stylebar::-webkit-scrollbar { width:6px; height:6px; }
  .toolbar::-webkit-scrollbar-thumb, .stylebar::-webkit-scrollbar-thumb {
    background:#666; border-radius:3px;
  }
  .toolbar::-webkit-scrollbar-track, .stylebar::-webkit-scrollbar-track { background:transparent; }
  .toolbar, .stylebar { scrollbar-width:thin; scrollbar-color:#666 transparent; }

  /* 画面(ウインドウ幅)が狭いモニターでは、ボタンやラベルを一回り小さくして
     同じ行数設定でもより多くの項目が収まるようにする */
  @media (max-width: 1100px){
    button.tool { padding:5px 8px; font-size:11px; }
    label.radio { padding:4px 7px; font-size:11px; }
    .tgroup { padding:3px 5px; gap:3px; }
    .toolbar { gap:3px; padding:5px 6px; }
  }

  button.tool {
    background:#555; color:#fff; border:none; border-radius:4px;
    padding:6px 10px; font-size:12px; cursor:pointer; white-space:nowrap;
    flex-shrink:0;
  }
  button.tool:hover { background:#686868; }
  button.tool:disabled { opacity:.4; cursor:default; }
  button.tool.danger:hover { background:#8a3d3d; }

  label.radio {
    display:flex; align-items:center; gap:3px; background:#444;
    padding:5px 9px; border-radius:4px; cursor:pointer; font-size:12px;
    white-space:nowrap; flex-shrink:0;
  }
  label.radio.active { background:#2f6f4f; }
  label.radio input { display:none; }

  input[type=number] { width:52px; background:#222; color:#fff; border:1px solid #555; border-radius:3px; padding:3px; }
  input[type=color]  { width:32px; height:24px; border:none; background:none; padding:0; cursor:pointer; }
  select { background:#222; color:#fff; border:1px solid #555; border-radius:3px; padding:3px; font-size:12px; }
  input[type=range] { vertical-align:middle; }

  /* ツールバー群をまとめて非表示にする機能 */
  .toolbarToggleBar{
    background:#333; border-bottom:1px solid #222; display:flex;
    justify-content:center; align-items:center; gap:14px; padding:2px 0; flex-shrink:0;
  }
  .toolbarRowsCtrl{ display:flex; align-items:center; gap:5px; color:#9c9; font-size:11px; }
  .toolbarRowsCtrl select{
    background:#222; color:#ccc; border:1px solid #555; border-radius:3px;
    padding:1px 4px; font-size:11px;
  }
  .toolbarToggleBar button{
    background:none; border:none; color:#9c9; font-size:11px; cursor:pointer;
    padding:2px 14px; white-space:nowrap;
  }
  .toolbarToggleBar button:hover{ color:#3fae7a; }
  #toolbarsWrap.collapsed{ display:none; }

  #canvasWrap {
    flex:1; overflow:auto; background:#1a1a1a; position:relative;
    display:flex; align-items:flex-start; justify-content:center;
  }
  #stage { position:relative; margin:20px; box-shadow:0 0 18px rgba(0,0,0,.6); }
  #pdfCanvas, #annoCanvas { position:absolute; top:0; left:0; }
  #annoCanvas { cursor:crosshair; }

  #dropHint {
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    color:#777; font-size:15px; text-align:center; pointer-events:none;
  }
  #statusBar {
    background:#242424; color:#999; font-size:11px; padding:3px 10px; border-top:1px solid #222;
  }
  #fileInput { display:none; }
  .fileChip {
    background:#444; padding:4px 8px; border-radius:4px; font-size:11px; cursor:pointer; color:#ddd;
    border:1px solid #555; display:flex; align-items:center; gap:5px;
  }
  .fileChip.active { background:#2f6f4f; border-color:#3fae7a; }
  .fileChip .rm { color:#e88; font-weight:bold; padding:0 2px; }
  .fileChip .rm:hover { color:#f55; }

  /* ライセンスキー入力ゲート */
  .license-overlay{
    position:fixed;inset:0;background:#2b2b2b;
    z-index:9999;display:none;align-items:center;justify-content:center;
  }
  .license-overlay.vis{display:flex;}
  .license-box{
    background:#3c3c3c;border:1px solid #555;border-radius:14px;
    padding:24px;width:min(300px,88vw);box-shadow:0 8px 28px rgba(0,0,0,0.5);
    text-align:center;
  }
  .license-title{font-size:15px;font-weight:700;color:#3fae7a;margin-bottom:6px;}
  .license-sub{font-size:11px;color:#aaa;margin-bottom:16px;line-height:1.5;}
  .license-box input{
    width:100%;padding:10px;border:1.5px solid #555;border-radius:8px;
    background:#222;color:#fff;font-size:15px;margin-bottom:10px;text-align:center;
    letter-spacing:1px;
  }
  .license-err{color:#f55;font-size:11px;margin-bottom:10px;display:none;}
  .license-btn{
    width:100%;padding:10px;border-radius:8px;border:none;background:#2f6f4f;color:#fff;
    font-weight:700;font-size:14px;cursor:pointer;
  }
  .license-btn:hover{background:#3fae7a;}

  /* トースト通知 */
  #toast{
    position:fixed; left:50%; bottom:64px; transform:translateX(-50%) translateY(10px);
    background:#333; color:#fff; padding:10px 18px; border-radius:8px;
    font-size:13px; box-shadow:0 4px 14px rgba(0,0,0,.5); z-index:10000;
    opacity:0; pointer-events:none; transition:opacity .18s ease, transform .18s ease;
    white-space:nowrap;
  }
  #toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="license-overlay" id="licenseOverlay">
  <div class="license-box">
    <div class="license-title">🔒 ライセンスキーを入力</div>
    <div class="license-sub">このアプリを継続してご利用いただくには、配布されたライセンスキーの入力が必要です（約6か月ごとに再確認されます）</div>
    <input id="licenseKeyField" type="text" inputmode="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="ライセンスキー">
    <div class="license-err" id="licenseError">キーが正しくありません。管理者にご確認ください。</div>
    <button class="license-btn" id="licenseConfirmBtn">確認</button>
  </div>
</div>
<div id="app">

  <div class="toolbarToggleBar">
    <button id="btnToggleToolbars" type="button">▲ ツールバーを隠す</button>
    <label class="toolbarRowsCtrl">表示行数:
      <select id="toolbarRowsSelect">
        <option value="1">1列</option>
        <option value="2" selected>2列</option>
        <option value="3">3列</option>
      </select>
    </label>
  </div>

  <div id="toolbarsWrap">

  <div class="toolbar" id="mainToolbar">
    <div class="dndItem" data-dnd-id="file">
      <span class="dndHandle" title="ドラッグで並び替え">⠿</span>
      <div class="tgroup">
        <button class="tool" id="btnOpen" title="複数のPDFをまとめて開けます（ダイアログでCtrl/Cmd+クリックまたはShift+クリックで複数選択）">📂 開く</button>
        <button class="tool" id="btnAdd" title="複数のPDFをまとめて追加できます（ダイアログでCtrl/Cmd+クリックまたはShift+クリックで複数選択）">➕ PDF追加</button>
        <button class="tool" id="btnSave" disabled>💾 保存</button>
      </div>
      <div class="sep"></div>
    </div>

    <div class="dndItem" data-dnd-id="filechips">
      <span class="dndHandle" title="ドラッグで並び替え">⠿</span>
      <div id="fileChipsBar" style="display:none;align-items:center;gap:8px;background:#474747;padding:4px 8px;border-radius:6px;flex-shrink:0;font-size:12px;color:#ccc;">
        <span style="color:#aaa;">読込中のPDF:</span>
        <div id="fileChips" style="display:flex;gap:6px;flex-wrap:wrap;"></div>
        <div class="sep"></div>
        <button class="tool" id="btnDeleteSelectedFiles">選択削除</button>
        <button class="tool" id="btnSaveSelectedFiles">選択保存</button>
        <button class="tool" id="btnClearAllFiles">全解除</button>
      </div>
      <div class="sep"></div>
    </div>

    <div class="dndItem" data-dnd-id="page">
      <span class="dndHandle" title="ドラッグで並び替え">⠿</span>
      <div class="tgroup">
        <button class="tool" id="btnPrev">◀ 前ページ</button>
        <span id="pageLabel">- / -</span>
        <button class="tool" id="btnNext">次ページ ▶</button>
      </div>
      <div class="sep"></div>
    </div>

    <div class="dndItem" data-dnd-id="zoom">
      <span class="dndHandle" title="ドラッグで並び替え">⠿</span>
      <div class="tgroup">
        <button class="tool" id="zoom50">50%</button>
        <button class="tool" id="zoom75">75%</button>
        <button class="tool" id="zoom100">100%</button>
        <button class="tool" id="zoom150">150%</button>
        <button class="tool" id="zoom200">200%</button>
      </div>
      <div class="sep"></div>
    </div>

    <div class="dndItem" data-dnd-id="list">
      <span class="dndHandle" title="ドラッグで並び替え">⠿</span>
      <button class="tool" id="btnToggleList">📋 一覧</button>
      <div class="sep"></div>
    </div>

    <div class="dndItem" data-dnd-id="mode">
      <span class="dndHandle" title="ドラッグで並び替え">⠿</span>
      <div class="tgroup">
        <label class="radio active" data-mode="add_weld"><input type="radio" name="mode" value="add_weld" checked>🔢 番号追加</label>
        <label class="radio" data-mode="add_text"><input type="radio" name="mode" value="add_text">✏ テキスト追加</label>
        <label class="radio" data-mode="range_select"><input type="radio" name="mode" value="range_select">⬜ 範囲選択</label>
        <label class="radio" data-mode="select"><input type="radio" name="mode" value="select">☑ 選択/欠番</label>
        <label class="radio" data-mode="delete"><input type="radio" name="mode" value="delete">🗑 削除</label>
      </div>
      <div class="sep"></div>
    </div>

    <div class="dndItem" data-dnd-id="style">
      <span class="dndHandle" title="ドラッグで並び替え">⠿</span>
      <div class="tgroup">
        <span>線の太さ:</span><input type="range" id="lw" min="0.5" max="5" step="0.5" value="1.2">
        <span>丸の大きさ:</span><input type="range" id="cr" min="5" max="25" step="1" value="9">
        <span>文字サイズ:</span><input type="range" id="fs" min="5" max="30" step="1" value="10">
      </div>
      <div class="sep"></div>
    </div>

    <div class="dndItem" data-dnd-id="color">
      <span class="dndHandle" title="ドラッグで並び替え">⠿</span>
      <div class="tgroup">
        <span>色:</span><input type="color" id="colorPick" value="#ff0000">
        <span id="colorPresets" style="display:flex;gap:3px;">
          <button type="button" class="colorPresetBtn" data-color="#ff0000" style="width:20px;height:20px;border-radius:3px;border:1px solid #666;background:#ff0000;cursor:pointer;padding:0;" title="赤"></button>
          <button type="button" class="colorPresetBtn" data-color="#0000ff" style="width:20px;height:20px;border-radius:3px;border:1px solid #666;background:#0000ff;cursor:pointer;padding:0;" title="青"></button>
          <button type="button" class="colorPresetBtn" data-color="#00aa00" style="width:20px;height:20px;border-radius:3px;border:1px solid #666;background:#00aa00;cursor:pointer;padding:0;" title="緑"></button>
          <button type="button" class="colorPresetBtn" data-color="#000000" style="width:20px;height:20px;border-radius:3px;border:1px solid #666;background:#000000;cursor:pointer;padding:0;" title="黒"></button>
          <button type="button" class="colorPresetBtn" data-color="#ff8c00" style="width:20px;height:20px;border-radius:3px;border:1px solid #666;background:#ff8c00;cursor:pointer;padding:0;" title="橙"></button>
        </span>
      </div>
      <div class="sep"></div>
    </div>

    <div class="dndItem" data-dnd-id="font">
      <span class="dndHandle" title="ドラッグで並び替え">⠿</span>
      <div class="tgroup">
        <span>フォント:</span>
        <select id="fontSelect">
          <option value="gothic" selected>ゴシック体（日本語可）</option>
          <option value="mincho">明朝体（日本語可）</option>
          <option value="helv">Helvetica（英数字専用）</option>
          <option value="courier">Courier（英数字専用）</option>
        </select>
      </div>
      <div class="sep"></div>
    </div>

    <div class="dndItem" data-dnd-id="applystyle">
      <span class="dndHandle" title="ドラッグで並び替え">⠿</span>
      <button class="tool" id="btnApplyStyle" style="background:#446688;">選択に適用</button>
      <div class="sep"></div>
    </div>

    <div class="dndItem" data-dnd-id="comment">
      <span class="dndHandle" title="ドラッグで並び替え">⠿</span>
      <div class="tgroup">
        <label class="radio" data-mode="add_comment"><input type="radio" name="mode" value="add_comment">📝 コメント(非印刷)</label>
        <label class="radio" data-mode="add_arrow_text"><input type="radio" name="mode" value="add_arrow_text">➘ 矢印付き文字</label>
      </div>
      <div class="sep"></div>
    </div>

    <div class="dndItem" data-dnd-id="shapes">
      <span class="dndHandle" title="ドラッグで並び替え">⠿</span>
      <div class="tgroup">
        <label class="radio" data-mode="add_rect"><input type="radio" name="mode" value="add_rect">▭ 四角形</label>
        <label class="radio" data-mode="add_ellipse"><input type="radio" name="mode" value="add_ellipse">◯ 円/楕円</label>
        <label class="radio" data-mode="add_triangle"><input type="radio" name="mode" value="add_triangle">△ 三角形</label>
        <label class="radio" data-mode="add_freehand"><input type="radio" name="mode" value="add_freehand">✎ フリーハンド</label>
      </div>
      <div class="sep"></div>
    </div>

    <div class="dndItem" data-dnd-id="delmode">
      <span class="dndHandle" title="ドラッグで並び替え">⠿</span>
      <div class="tgroup">
        <span>取消時の番号:</span>
        <label style="display:flex;align-items:center;gap:2px;cursor:pointer;">
          <input type="radio" name="delMode" value="renumber" checked>詰める
        </label>
        <label style="display:flex;align-items:center;gap:2px;cursor:pointer;">
          <input type="radio" name="delMode" value="keep">欠番のまま
        </label>
      </div>
      <div class="sep"></div>
    </div>

    <div class="dndItem" data-dnd-id="undo">
      <span class="dndHandle" title="ドラッグで並び替え">⠿</span>
      <div class="tgroup">
        <button class="tool" id="btnUndo" disabled>◀ 戻る</button>
        <button class="tool" id="btnRedo" disabled>進む ▶</button>
        <button class="tool" id="btnResetPage">このページを1から振直し</button>
      </div>
      <div class="sep"></div>
    </div>

    <div class="dndItem" data-dnd-id="startnum">
      <span class="dndHandle" title="ドラッグで並び替え">⠿</span>
      <div class="tgroup">
        <span style="font-size:12px;">開始番号:</span>
        <input type="number" id="startNum" value="1" min="1">
        <button class="tool" id="btnApplyStart">この番号から採番</button>
      </div>
    </div>
  </div>

  <div id="annotListPanel" style="display:block;position:fixed;top:0;right:0;bottom:0;width:260px;
      background:#2f2f2f;border-left:1px solid #555;z-index:500;overflow-y:auto;font-size:12px;color:#ddd;">
    <div style="padding:8px 10px;background:#3c3c3c;border-bottom:1px solid #222;display:flex;justify-content:space-between;align-items:center;">
      <span>アノテーション一覧</span>
      <button class="tool" id="btnCloseList" style="padding:2px 8px;">✕</button>
    </div>
    <div id="annotListBody" style="padding:6px 8px;"></div>
  </div>

  </div><!-- /#toolbarsWrap -->

  <div id="canvasWrap">
    <div id="stage">
      <canvas id="pdfCanvas"></canvas>
      <canvas id="annoCanvas"></canvas>
    </div>
    <div id="dropHint">PDFファイルをここにドラッグ＆ドロップ、または「📂 開く」から選択してください</div>
  </div>

  <div id="statusBar" style="display:flex;align-items:center;justify-content:space-between;gap:8px;">
    <span id="statusBarText">準備完了</span>
    <button id="btnCancelPending" type="button" style="display:none;background:#a33;color:#fff;border:none;border-radius:4px;padding:2px 10px;font-size:11px;cursor:pointer;flex-shrink:0;">✕ 取消</button>
  </div>
</div>

<div id="toast"></div>

<input type="file" id="fileInput" accept="application/pdf" multiple>
<input type="file" id="fileInputAdd" accept="application/pdf" multiple style="display:none;">

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
const { PDFDocument, rgb, StandardFonts, degrees, PDFName, PDFHexString } = PDFLib;

/* ===================== 状態 ===================== */
let pdfFiles = [];          // [{name, bytes(ArrayBuffer), pdfjsDoc, pageCount, offset}]
let totalPages = 0;
let curPage = 0;            // 0-indexed（複数PDFをまたぐグローバルページ番号）
let zoom = 1.0;
const ZOOM_LEVELS = [0.1,0.12,0.15,0.18,0.2,0.23,0.25,0.28,0.33,0.38,0.4,0.45,0.5,0.55,0.6,0.67,
  0.75,0.82,0.85,0.9,1.0,1.05,1.1,1.15,1.2,1.25,1.3,1.4,1.5,1.6,1.65,1.75,1.8,1.9,2.0,2.1,2.25,2.4,2.5,2.65,2.75,3.0,3.25,3.5,4.0];
let curViewport = null;     // 現在ページ用（座標変換用）
let dpr = window.devicePixelRatio || 1;
let canvasScale = dpr;   // 実際にcanvas解像度へ掛ける倍率（低ズーム時の粗さ対策込み）
const RENDER_MIN_ZOOM = 1.5; // これより低いズームでも、この倍率相当の解像度で描画してぼやけを防ぐ

function recomputeOffsets(){
  let off = 0;
  for (const pf of pdfFiles){ pf.offset = off; off += pf.pageCount; }
  totalPages = off;
}
function locatePage(g){
  for (const pf of pdfFiles){ if (g>=pf.offset && g<pf.offset+pf.pageCount) return {pf, local: g-pf.offset}; }
  return null;
}

/* line/freehand/rect/ellipse/triangle は「x,y という単一の基準点」を持たず、
   すべての形状情報を points 配列だけで表現する点で共通のため、
   ヒットテストやドラッグ移動・コピー等の処理をまとめて扱うための判定関数 */
function isPathKind(kind){
  return kind==="line" || kind==="freehand" || kind==="rect" || kind==="ellipse" || kind==="triangle";
}
/* 四角形/円・楕円/三角形は points に「対角2点（バウンディングボックス）」だけを保存し、
   実際に描画・当たり判定に使う輪郭座標はここで都度計算する（line/freehandはpointsがそのまま輪郭） */
function shapeBoundaryPoints(a){
  if (a.kind==="line" || a.kind==="freehand") return a.points;
  const [[x1,y1],[x2,y2]] = a.points;
  const xlo=Math.min(x1,x2), xhi=Math.max(x1,x2), ylo=Math.min(y1,y2), yhi=Math.max(y1,y2);
  if (a.kind==="rect"){
    return [[xlo,ylo],[xhi,ylo],[xhi,yhi],[xlo,yhi],[xlo,ylo]];
  }
  if (a.kind==="triangle"){
    const midx=(xlo+xhi)/2;
    return [[midx,yhi],[xhi,ylo],[xlo,ylo],[midx,yhi]];
  }
  if (a.kind==="ellipse"){
    const cx=(xlo+xhi)/2, cy=(ylo+yhi)/2, rx=(xhi-xlo)/2, ry=(yhi-ylo)/2, N=28, pts=[];
    for (let i=0;i<=N;i++){ const t=i/N*Math.PI*2; pts.push([cx+rx*Math.cos(t), cy+ry*Math.sin(t)]); }
    return pts;
  }
  return a.points;
}
/* 矢印付き文字：矢先(tipX,tipY)から見て、線の来た方向(fromX,fromY)と逆向きに開く
   「V字」の矢じるしを表す2本の短い線分を返す（PDF書き出しでも同じ関数を使い回す） */
function arrowHeadSegments(tipX, tipY, fromX, fromY, size){
  const ang = Math.atan2(tipY-fromY, tipX-fromX);
  const wing = Math.PI*(150/180);
  const a1 = ang+wing, a2 = ang-wing;
  return [
    [[tipX,tipY],[tipX+size*Math.cos(a1), tipY+size*Math.sin(a1)]],
    [[tipX,tipY],[tipX+size*Math.cos(a2), tipY+size*Math.sin(a2)]],
  ];
}

async function loadFiles(fileList, append){
  const files = Array.from(fileList).filter(f=>f.type==="application/pdf" || f.name.toLowerCase().endsWith(".pdf"));
  if (!files.length) return;
  setStatus("読み込み中...");

  if (!append){
    pdfFiles = [];
    annots = [];
    nextNumByPage = {};
    undoStack = []; redoStack = [];
    selectedItems = [];
    curPage = 0;
    isDirty = false;
    waitingStart=false; startPdf=null; startClient=null;
    numPolyMode=false; numPolyPts=[]; numLineMouseCur=null;
    pressInfo=null; numDragRect=false; numRangeStartPdf=null; numRangeCurPdf=null;
    basePickMode=null; baseClipboard=[]; pasteMode=false; pasteWasMove=false; moveUndoIndex=null;
  }

  const startIdx = pdfFiles.length;
  const pendingRestores = [];
  for (const file of files){
    const buf = await file.arrayBuffer();
    const bytes = buf.slice(0);

    // このツールで保存したPDFであれば、前回配置した番号/テキストの情報が
    // 埋め込まれているので、それを取り出しておく（オフセット確定後に反映する）。
    // ついでに、画面表示専用のコピー（本ツール由来のアノテーションを除いたもの）も
    // ここで作っておく。他社アプリ/他者が付けた注釈（スタンプ等）はそのまま残し、
    // pdf.js標準の描画で表示させるためのもの（本ツール自身の円・線・番号は
    // annoCanvas側で自前描画するので、pdf.js側では表示させない＝二重表示防止）。
    let displayBytes = bytes;
    let restoredAnnots = null;
    try{
      const plDoc = await PDFDocument.load(bytes);
      const val = plDoc.catalog.lookup(PDFName.of("WeldToolData"));
      if (val){
        const payload = JSON.parse(val.decodeText());
        if (payload && Array.isArray(payload.annots)) restoredAnnots = payload.annots;
      }
      let hasOwnAnnots = false;
      plDoc.getPages().forEach(page=>{
        const kept = keepNonToolAnnotRefs(plDoc.context, page);
        const existingRef = page.node.get(PDFName.of("Annots"));
        if (existingRef){
          const existingArr = plDoc.context.lookup(existingRef);
          const beforeCount = (existingArr && typeof existingArr.size === "function") ? existingArr.size() : 0;
          if (beforeCount !== kept.length) hasOwnAnnots = true;
        }
        page.node.set(PDFName.of("Annots"), plDoc.context.obj(kept));
      });
      if (hasOwnAnnots){
        displayBytes = await plDoc.save();
      }
    }catch(e){
      console.warn("前回のアノテーションデータの読み込み、または表示用コピーの作成に失敗しました", e);
    }

    // 一部のPDF（特定の日本語フォントを使ったもの）では、pdf.js側に文字コード
    // 変換用の補助データ(CMap)の場所を教えないと、該当フォントの読み込みに失敗し
    // その文字だけが表示されなくなることが確認されたため、明示的に指定している。
    const doc = await pdfjsLib.getDocument({
      data: displayBytes.slice(0), // 保存用の pf.bytes とメモリを共有しないよう必ず複製する
      // （pdf.jsはdataに渡したArrayBufferをワーカーへ転送(detach)してしまうため、
      //   同じバッファを共有していると保存時に「detached ArrayBuffer」エラーになる）
      cMapUrl: "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/cmaps/",
      cMapPacked: true,
    }).promise;
    const pf = {name:file.name, bytes, pdfjsDoc:doc, pageCount:doc.numPages, offset:0};
    pdfFiles.push(pf);
    if (restoredAnnots) pendingRestores.push({pf, restored: restoredAnnots});
  }
  recomputeOffsets();

  if (pendingRestores.length){
    pendingRestores.forEach(({pf, restored})=>{
      restored.forEach(a=>{
        annots.push({...a, page: a.page + pf.offset});
      });
    });
    const touchedPages = new Set(annots.filter(a=>a.kind==="weld").map(a=>a.page));
    touchedPages.forEach(recalcNextNumForPage);
    setStatus(`前回配置した ${pendingRestores.reduce((s,r)=>s+r.restored.length,0)} 個の項目を復元しました`);
  }

  if (append){
    curPage = pdfFiles[startIdx].offset;   // 追加したファイルの先頭ページへ移動
  }

  dropHint.style.display = "none";
  document.getElementById("btnSave").disabled = false;
  updateUndoRedoButtons();
  renderFileChips();
  await renderPage();
  setStatus(`${files.length} 個のPDFを読み込みました（全 ${totalPages} ページ / ${pdfFiles.length} ファイル）`);
}

async function removeFiles(filesToRemove){
  if (!filesToRemove.length) return;
  const removedSet = new Set(filesToRemove);
  const oldOrder = pdfFiles.slice();
  function oldPfOf(page){
    for (const pf of oldOrder){ if (page>=pf.offset && page<pf.offset+pf.pageCount) return pf; }
    return null;
  }
  oldOrder.forEach(pf=>{ pf._oldOffset = pf.offset; });

  const kept = [];
  for (const a of annots){
    const pf = oldPfOf(a.page);
    if (!pf || removedSet.has(pf)) continue;
    kept.push({a, pf});
  }

  pdfFiles = oldOrder.filter(pf=>!removedSet.has(pf));
  recomputeOffsets();

  annots = kept.map(({a,pf})=> ({...a, page: (a.page - pf._oldOffset) + pf.offset}));
  selectedItems = [];

  if (!pdfFiles.length){
    curPage = 0; totalPages = 0;
    isDirty = false;
    dropHint.style.display = "flex";
    document.getElementById("btnSave").disabled = true;
    pdfCtx.clearRect(0,0,pdfCanvas.width,pdfCanvas.height);
    annoCtx.clearRect(0,0,annoCanvas.width,annoCanvas.height);
    pageLabel.textContent = "- / -";
  } else {
    isDirty = true;
    if (curPage>=totalPages) curPage = totalPages-1;
    if (curPage<0) curPage = 0;
    await renderPage();
  }
  renderFileChips();
}

function renderFileChips(){

      await removeFiles([pf]);
    };
    wrap.appendChild(chip);
  });
}

function renderAnnotList(){
  const panel = document.getElementById("annotListPanel");
  const body = document.getElementById("annotListBody");
  if (!panel || panel.style.display === "none") return; // 非表示中は描画を省略
  if (!annots.length){
    body.innerHTML = `<div style="color:#888;padding:6px 2px;">まだ何も配置されていません</div>`;
    return;
  }
  const sorted = annots.slice().sort((a,b)=>{
    if (a.page !== b.page) return a.page - b.page;
    if (a.kind==="weld" && b.kind==="weld") return a.number - b.number;
    return 0;
  });
  body.innerHTML = sorted.map(a=>{
    const loc = locatePage(a.page);
    const pageNoInFile = loc ? (loc.local+1) : (a.page+1);
    const fileName = loc ? loc.pf.name : "";
    let label;
    if (a.kind==="weld") label = `🔢 No.${a.number}`;
    else if (a.kind==="text") label = `✏ ${a.text}`;
    else if (a.kind==="comment") label = `📝 ${a.text}（非印刷）`;
    else if (a.kind==="arrow_text") label = `➘ ${a.text}`;
    else if (a.kind==="rect") label = "▭ 四角形";
    else if (a.kind==="ellipse") label = "◯ 円・楕円";
    else if (a.kind==="triangle") label = "△ 三角形";
    else if (a.kind==="freehand") label = "✎ フリーハンド";
    else label = "📐 引き出し線";
    const style = a.voided ? "color:#888;text-decoration:line-through;" : "color:#ddd;";
    return `<div class="annotListItem" data-page="${a.page}" title="${fileName}"
      style="padding:4px 4px;border-bottom:1px solid #444;cursor:pointer;font-size:12px;${style}">
      P.${pageNoInFile}　${label}</div>`;
  }).join("");
  body.querySelectorAll(".annotListItem").forEach(el=>{
    el.addEventListener("click", async ()=>{
      const p = parseInt(el.dataset.page, 10);
      if (p === curPage) return;
      curPage = p;
      await renderPage();
    });
  });
}

/* ===================== ツールバーの表示行数（1〜3列、デフォルト2列） ===================== */
(function(){
  const ROWS_KEY = "weldtool_toolbar_rows";
  const toolbar = document.getElementById("mainToolbar");
  const select  = document.getElementById("toolbarRowsSelect");
  if (!toolbar) return;

  function applyRows(rows){
    const items = toolbar.querySelectorAll(":scope > .dndItem");
    let itemH = 0;
    items.forEach(el => { itemH = Math.max(itemH, el.offsetHeight); });
    if (!itemH) itemH = 30; // 初回未描画時などのフォールバック
    const cs = getComputedStyle(toolbar);
    const padTop    = parseFloat(cs.paddingTop) || 0;
    const padBottom = parseFloat(cs.paddingBottom) || 0;
    const rowGap    = parseFloat(cs.rowGap) || 4;
    const maxH = Math.round(rows * itemH + (rows - 1) * rowGap + padTop + padBottom);
    toolbar.style.maxHeight = maxH + "px";
  }

  let rows = 2;
  try{
    const saved = parseInt(localStorage.getItem(ROWS_KEY), 10);
    if (saved === 1 || saved === 2 || saved === 3) rows = saved;
  }catch(e){}
  if (select) select.value = String(rows);

  // レイアウト確定後（フォントや折り返しが決まった後）に高さを計算する
  requestAnimationFrame(()=> applyRows(rows));
  window.addEventListener("resize", ()=> applyRows(rows));

  if (select){
    select.addEventListener("change", ()=>{
      rows = parseInt(select.value, 10) || 2;
      try{ localStorage.setItem(ROWS_KEY, String(rows)); }catch(e){}
      applyRows(rows);
    });
  }
})();

/* ===================== ツールバーの並び替え（種類ごとにドラッグ＆ドロップ） =====================
   各グループ（.dndItem）はドラッグして左右に位置を入れ替えられる。
   並び順はブラウザ（localStorage）に保存され、次回起動時もそのユーザーの並びで復元される。 */
(function(){
  const ORDER_KEY = "weldtool_toolbar_order";
  const bar = document.getElementById("mainToolbar");
  if (!bar) return;

  function items(){ return Array.from(bar.querySelectorAll(":scope > .dndItem")); }

  // 保存済みの並び順があれば復元（未知のIDや新規追加分は末尾にそのまま残す）
  function restoreOrder(){
    let order;
    try{ order = JSON.parse(localStorage.getItem(ORDER_KEY) || "null"); }catch(e){ order = null; }
    if (!Array.isArray(order) || !order.length) return;
    const map = new Map(items().map(el => [el.dataset.dndId, el]));
    order.forEach(id => { const el = map.get(id); if (el){ bar.appendChild(el); map.delete(id); } });
    // 保存データに無い（新しく追加された）項目は元の位置のまま末尾側に残る
  }
  function saveOrder(){
    const order = items().map(el => el.dataset.dndId);
    try{ localStorage.setItem(ORDER_KEY, JSON.stringify(order)); }catch(e){}
  }
  restoreOrder();

  let dragEl = null;
  let lastOverEl = null;
  let lastBefore = null;
  let activePointerId = null;

  function clearDragOverMarks(){
    items().forEach(el => el.classList.remove("dragOverBefore","dragOverAfter"));
  }

  // ① カーソルのY座標から「今どの行にいるか」を先に決める
  // ② その行の中だけで、カーソルが乗っているタブ（無ければ一番近いタブ）を横方向で決める
  // 行を区別せず横位置だけで探すと、別の行にある無関係なタブを拾ってしまうため
  // 必ず行を絞り込んでから横方向の判定を行う。
  function findDropTarget(clientX, clientY){
    const its = items().filter(el => el !== dragEl);
    if (!its.length) return null;

    // 1) カーソルYが縦範囲に収まっている行を探す
    let rowItems = its.filter(el=>{
      const r = el.getBoundingClientRect();
      return clientY >= r.top && clientY <= r.bottom;
    });

    // どの行にも乗っていない（行間の隙間にいる）場合はY方向で一番近い行を採用
    if (!rowItems.length){
      let bestRowTop = null, bestRowDist = Infinity;
      its.forEach(el=>{
        const r = el.getBoundingClientRect();
        const cy = r.top + r.height / 2;
        const d = Math.abs(clientY - cy);
        if (d < bestRowDist){ bestRowDist = d; bestRowTop = r.top; }
      });
      rowItems = its.filter(el=>{
        const r = el.getBoundingClientRect();
        return Math.abs(r.top - bestRowTop) < 6;
      });
    }

    // 2) その行の中で、カーソルが乗っているタブをそのまま使う
    for (const el of rowItems){
      const r = el.getBoundingClientRect();
      if (clientX >= r.left && clientX <= r.right){
        const cx = r.left + r.width / 2;
        return { over: el, before: clientX < cx };
      }
    }

    // 3) 隙間にいる場合は、その行の中で一番近い中心のタブを使う
    let best = null, bestDist = Infinity, bestBefore = true;
    for (const el of rowItems){
      const r = el.getBoundingClientRect();
      const cx = r.left + r.width / 2;
      const dist = Math.abs(clientX - cx);
      if (dist < bestDist){
        bestDist = dist;
        best = el;
        bestBefore = clientX < cx;
      }
    }
    return best ? { over: best, before: bestBefore } : null;
  }

  function finishDrag(){
    if (dragEl){
      dragEl.classList.remove("dragging");
      if (lastOverEl && lastOverEl !== dragEl && bar.contains(lastOverEl)){
        bar.insertBefore(dragEl, lastBefore ? lastOverEl : lastOverEl.nextSibling);
        saveOrder();
      }
    }
    clearDragOverMarks();
    dragEl = null; lastOverEl = null; lastBefore = null; activePointerId = null;
  }

  function onPointerMove(e){
    if (!dragEl || e.pointerId !== activePointerId) return;
    const target = findDropTarget(e.clientX, e.clientY);
    clearDragOverMarks();
    if (target){
      target.over.classList.add(target.before ? "dragOverBefore" : "dragOverAfter");
      lastOverEl = target.over;
      lastBefore = target.before;
    } else {
      lastOverEl = null; lastBefore = null;
    }
  }

  function onPointerUp(e){
    if (e.pointerId !== activePointerId) return;
    window.removeEventListener("pointermove", onPointerMove);
    window.removeEventListener("pointerup", onPointerUp);
    window.removeEventListener("pointercancel", onPointerUp);
    finishDrag();
  }

  // 標準のHTML5ドラッグAPI(draggable属性)はブラウザによって挙動が不安定なため使わず、
  // ハンドル(.dndHandle)を掴んだ瞬間からpointermove/pointerupで自前追跡する方式にしている。
  // これによりハイライト表示と実際の移動先が常に同じ計算結果になり、ズレようがない。
  bar.addEventListener("pointerdown", (e)=>{
    const handle = e.target.closest(".dndHandle");
    if (!handle) return;
    const el = handle.closest(".dndItem");
    if (!el) return;
    e.preventDefault();
    dragEl = el;
    activePointerId = e.pointerId;
    el.classList.add("dragging");
    window.addEventListener("pointermove", onPointerMove);
    window.addEventListener("pointerup", onPointerUp);
    window.addEventListener("pointercancel", onPointerUp);
  });
})();

/* ===================== 描画 ===================== */
async function renderPage(){
  if (!pdfFiles.length) return;
  const loc = locatePage(curPage);
  if (!loc) return;
  // 変更理由: ページ切替(次ページ/前ページ/ファイル切替/一覧からのジャンプ等)は
  // curPageの更新が同期的に行われる一方、実際の描画(page.getPage/render)は非同期のため、
  // 「curPageはもう新しいページなのに、curViewport(クリック座標の変換に使う)はまだ
  // 古いページのまま」という一瞬のズレが発生し得る。この間にキャンバスをタップすると、
  // 古いページ基準で座標変換された位置が新しいページ番号のアノテーションとして
  // 保存されてしまい、「別ページ／別ファイルに貼り付けたのに反映されない（＝見当たらない
  // 位置に飛んでいる）」という不具合の原因になっていた。
  // 読み込みが完了するまでcurViewportをnullにしておき、その間のクリックは
  // (mousedown/dblclick側のガードで)無視されるようにすることでこれを防ぐ。
  curViewport = null;
  const page = await loc.pf.pdfjsDoc.getPage(loc.local+1);
  const viewport = page.getViewport({ scale: zoom });          // クリック座標変換用（CSSピクセル基準）
  canvasScale = Math.max(zoom, RENDER_MIN_ZOOM) / zoom * dpr;   // 低ズームでも一定解像度を保つための倍率
  const renderViewport = page.getViewport({ scale: zoom*canvasScale }); // 描画解像度用
  curViewport = viewport;

  pdfCanvas.width = renderViewport.width;
  pdfCanvas.height = renderViewport.height;
  pdfCanvas.style.width = viewport.width+"px";
  pdfCanvas.style.height = viewport.height+"px";
  annoCanvas.width = renderViewport.width;
  annoCanvas.height = renderViewport.height;
  annoCanvas.style.width = viewport.width+"px";
  annoCanvas.style.height = viewport.height+"px";
  stage.style.width = viewport.width+"px";
  stage.style.height = viewport.height+"px";

  // 読み込み時点で本ツール由来のアノテーション(WT-)は取り除いた「表示専用コピー」を
  // pdf.jsに渡しているため、ここでは既定の描画(他社アプリ由来の注釈も含めて表示)に戻す。
  await page.render({ canvasContext: pdfCtx, viewport: renderViewport }).promise;

  annoCtx.setTransform(1,0,0,1,0,0);
  annoCtx.scale(canvasScale,canvasScale);
  redrawAnnotations();
  pageLabel.textContent = `${curPage+1} / ${totalPages}  (${loc.pf.name}: ${loc.local+1}/${loc.pf.pageCount})`;
  renderFileChips();
}

function redrawAnnotations(){
  annoCtx.clearRect(0,0,annoCanvas.width/canvasScale, annoCanvas.height/canvasScale);
  const pageAnnots = annots.filter(a=>a.page===curPage);
  for (const a of pageAnnots){
    drawAnnotation(a);
  }
  // 採番/テキスト追加：始点(+折れ点)からのラバーバンド線プレビュー
  if ((waitingStart && startPdf) || (numPolyMode && numPolyPts.length)){
    const basePts = numPolyMode ? numPolyPts : [startPdf];
    annoCtx.save();
    annoCtx.strokeStyle = colorInput.value;
    annoCtx.lineWidth = parseFloat(lwInput.value);
    annoCtx.beginPath();
    basePts.forEach(([px,py],i)=>{
      const [vx,vy] = curViewport.convertToViewportPoint(px,py);
      if (i===0) annoCtx.moveTo(vx,vy); else annoCtx.lineTo(vx,vy);
    });
    if (numLineMouseCur){
      const [vx,vy] = curViewport.convertToViewportPoint(numLineMouseCur[0], numLineMouseCur[1]);
      annoCtx.setLineDash([4,3]);
      annoCtx.lineTo(vx,vy);
    }
    annoCtx.stroke();
    annoCtx.setLineDash([]);
    basePts.forEach(([px,py])=>{
      const [vx,vy] = curViewport.convertToViewportPoint(px,py);
      annoCtx.fillStyle = colorInput.value;
      annoCtx.beginPath(); annoCtx.arc(vx,vy,2.5,0,Math.PI*2); annoCtx.fill();
    });
    // 次に置かれる番号のプレビュー（テキストの場合は表示しない）
    if (mode==="add_weld" && numLineMouseCur){
      const [vx,vy] = curViewport.convertToViewportPoint(numLineMouseCur[0], numLineMouseCur[1]);
      const r = parseFloat(crInput.value), fs = parseFloat(fsInput.value);
      annoCtx.globalAlpha = 0.6;
      annoCtx.fillStyle = "#ffffff";
      annoCtx.beginPath(); annoCtx.arc(vx,vy,r,0,Math.PI*2); annoCtx.fill(); annoCtx.stroke();
      annoCtx.fillStyle = colorInput.value;
      annoCtx.font = `${fs}px ${cssFontFamily(fontSelect.value)}`;
      annoCtx.textAlign = "center"; annoCtx.textBaseline = "middle";
      annoCtx.fillText(String(curPage in nextNumByPage ? nextNumByPage[curPage] : (parseInt(startNumInput.value)||1)), vx, vy+1);
      annoCtx.globalAlpha = 1;
    }
    annoCtx.restore();
  }
  // 採番/テキスト追加：長押しドラッグによる範囲選択プレビュー
  if (numDragRect && numRangeStartPdf && numRangeCurPdf){
    const [vx1,vy1] = curViewport.convertToViewportPoint(numRangeStartPdf[0], numRangeStartPdf[1]);
    const [vx2,vy2] = curViewport.convertToViewportPoint(numRangeCurPdf[0], numRangeCurPdf[1]);
    annoCtx.save();
    annoCtx.strokeStyle = "#cc44ff";
    annoCtx.fillStyle = "rgba(204,68,255,0.15)";
    annoCtx.lineWidth = 1;
    annoCtx.setLineDash([5,3]);
    const rx = Math.min(vx1,vx2), ry = Math.min(vy1,vy2);
    const rw = Math.abs(vx2-vx1), rh = Math.abs(vy2-vy1);
    annoCtx.fillRect(rx,ry,rw,rh);
    annoCtx.strokeRect(rx,ry,rw,rh);
    annoCtx.restore();
  }
  if (rangeSelecting && rangeStartPdf && rangeCurPdf){
    const [vx1,vy1] = curViewport.convertToViewportPoint(rangeStartPdf[0], rangeStartPdf[1]);
    const [vx2,vy2] = curViewport.convertToViewportPoint(rangeCurPdf[0], rangeCurPdf[1]);
    annoCtx.save();
    annoCtx.strokeStyle = "#3ea6ff";
    annoCtx.fillStyle = "rgba(62,166,255,0.15)";
    annoCtx.lineWidth = 1;
    annoCtx.setLineDash([5,3]);
    const rx = Math.min(vx1,vx2), ry = Math.min(vy1,vy2);
    const rw = Math.abs(vx2-vx1), rh = Math.abs(vy2-vy1);
    annoCtx.fillRect(rx,ry,rw,rh);
    annoCtx.strokeRect(rx,ry,rw,rh);
    annoCtx.restore();
  }
  if (shapeDrawStart && shapeDrawCur){
    const previewPts = shapeBoundaryPoints({kind: mode.replace("add_",""), points:[shapeDrawStart, shapeDrawCur]});
    annoCtx.save();
    annoCtx.strokeStyle = colorInput.value;
    annoCtx.lineWidth = parseFloat(lwInput.value);
    annoCtx.setLineDash([4,3]);
    annoCtx.beginPath();
    previewPts.forEach(([px,py],i)=>{
      const [vx,vy] = curViewport.convertToViewportPoint(px,py);
      if (i===0) annoCtx.moveTo(vx,vy); else annoCtx.lineTo(vx,vy);
    });
    annoCtx.stroke();
    annoCtx.restore();
  }
  if (freehandPts && freehandPts.length){
    annoCtx.save();
    annoCtx.strokeStyle = colorInput.value;
    annoCtx.lineWidth = parseFloat(lwInput.value);
    annoCtx.beginPath();
    freehandPts.forEach(([px,py],i)=>{
      const [vx,vy] = curViewport.convertToViewportPoint(px,py);
      if (i===0) annoCtx.moveTo(vx,vy); else annoCtx.lineTo(vx,vy);
    });
    annoCtx.stroke();
    annoCtx.restore();
  }

  renderAnnotList();
}

function cssFontFamily(key){
  if (key==="mincho") return '"Yu Mincho","Hiragino Mincho ProN",serif';
  if (key==="helv") return 'Helvetica, Arial, sans-serif';
  if (key==="courier") return '"Courier New", Courier, monospace';
  return '"Yu Gothic","Hiragino Sans",sans-serif'; // gothic (既定)
}

function drawAnnotation(a){
  if (isPathKind(a.kind)){
    const color = a.voided ? "#999999" : a.color;
    const pts = shapeBoundaryPoints(a);
    annoCtx.save();
    annoCtx.strokeStyle = color;
    annoCtx.lineWidth = a.lw;
    annoCtx.beginPath();
    pts.forEach(([px,py],i)=>{
      const [vx,vy] = curViewport.convertToViewportPoint(px,py);
      if (i===0) annoCtx.moveTo(vx,vy); else annoCtx.lineTo(vx,vy);
    });
    annoCtx.stroke();
    if (selectedItems.includes(a)){
      annoCtx.strokeStyle = "#3ea6ff";
      annoCtx.lineWidth = 3;
      annoCtx.setLineDash([4,3]);
      annoCtx.stroke();
      annoCtx.setLineDash([]);
    }
    annoCtx.restore();
    return;
  }

  const [vx, vy] = curViewport.convertToViewportPoint(a.x, a.y);
  const color = a.voided ? "#999999" : a.color;
  annoCtx.save();
  annoCtx.strokeStyle = color;
  annoCtx.fillStyle = "#ffffff";
  annoCtx.lineWidth = a.lw;

  // 番号/テキストに紐づく引き出し線（始点→（折れ点）→番号位置）
  if (a.points && a.points.length){
    annoCtx.beginPath();
    const full = [...a.points, [a.x, a.y]];
    full.forEach(([px,py], i)=>{
      const [lvx,lvy] = curViewport.convertToViewportPoint(px,py);
      if (i===0) annoCtx.moveTo(lvx,lvy); else annoCtx.lineTo(lvx,lvy);
    });
    annoCtx.stroke();

    // 矢印付き文字：線の先端(a.points[0]、＝矢印の指す対象)に矢じるしを描く
    if (a.kind === "arrow_text"){
      const tip = full[0], from = full[1];
      const size = Math.max(6, a.fs*0.5);
      arrowHeadSegments(tip[0],tip[1], from[0],from[1], size).forEach(seg=>{
        annoCtx.beginPath();
        seg.forEach(([px,py],i)=>{
          const [lvx,lvy] = curViewport.convertToViewportPoint(px,py);
          if (i===0) annoCtx.moveTo(lvx,lvy); else annoCtx.lineTo(lvx,lvy);
        });
        annoCtx.stroke();
      });
    }
  }

  if (a.kind === "weld"){
    annoCtx.beginPath();
    annoCtx.arc(vx, vy, a.r, 0, Math.PI*2);
    annoCtx.fill();
    annoCtx.stroke();
    if (a.voided){
      annoCtx.beginPath();
      annoCtx.moveTo(vx-a.r*0.75, vy);
      annoCtx.lineTo(vx+a.r*0.75, vy);
      annoCtx.stroke();
    }
    annoCtx.fillStyle = color;
    annoCtx.font = `${a.fs}px ${cssFontFamily(a.font)}`;
    annoCtx.textAlign = "center";
    annoCtx.textBaseline = "middle";
    annoCtx.fillText(String(a.number), vx, vy+1);
  } else if (a.kind === "text"){
    // テキスト追加は番号追加と同じ「丸」で表示する
    annoCtx.font = `${a.fs}px ${cssFontFamily(a.font)}`;
    const tw = annoCtx.measureText(a.text).width;
    const rr2 = Math.max(a.r, tw/2+6);
    annoCtx.beginPath();
    annoCtx.arc(vx, vy, rr2, 0, Math.PI*2);
    annoCtx.fill();
    annoCtx.stroke();
    if (a.voided){
      annoCtx.beginPath();
      annoCtx.moveTo(vx-rr2*0.75, vy);
      annoCtx.lineTo(vx+rr2*0.75, vy);
      annoCtx.stroke();
    }
    annoCtx.fillStyle = color;
    annoCtx.textAlign = "center";
    annoCtx.textBaseline = "middle";
    annoCtx.fillText(a.text, vx, vy+1);
  } else {
    annoCtx.font = `${a.fs}px ${cssFontFamily(a.font)}`;
    const tw = annoCtx.measureText(a.text).width;
    const bw = tw+12, bh = a.fs+10;
    if (a.kind === "comment"){
      // コメントは「PDFには印刷されない自分用メモ」であることが一目で分かるよう、
      // 付箋風の黄色塗り＋破線枠で表示する
      annoCtx.fillStyle = a.voided ? "#cccccc" : "#fff6b0";
      annoCtx.fillRect(vx-bw/2, vy-bh/2, bw, bh);
      annoCtx.setLineDash([3,2]);
      annoCtx.strokeRect(vx-bw/2, vy-bh/2, bw, bh);
      annoCtx.setLineDash([]);
    } else {
      annoCtx.fillRect(vx-bw/2, vy-bh/2, bw, bh);
      annoCtx.strokeRect(vx-bw/2, vy-bh/2, bw, bh);
    }
    if (a.voided){
      annoCtx.beginPath();
      annoCtx.moveTo(vx-bw/2+2, vy);
      annoCtx.lineTo(vx+bw/2-2, vy);
      annoCtx.stroke();
    }
    annoCtx.fillStyle = color;
    annoCtx.textAlign = "center";
    annoCtx.textBaseline = "middle";
    annoCtx.fillText(a.text, vx, vy+1);
  }

  if (selectedItems.includes(a)){
    annoCtx.strokeStyle = "#3ea6ff";
    annoCtx.lineWidth = 1.5;
    annoCtx.setLineDash([4,3]);
    const rr = (a.kind==="weld") ? a.r+6 : Math.max(a.r, annoCtx.measureText(a.kind==="weld"?String(a.number):a.text).width/2)+8;
    annoCtx.strokeRect(vx-rr, vy-rr, rr*2, rr*2);
    annoCtx.setLineDash([]);
  }
  annoCtx.restore();
}

    shapeDrawStart=null; shapeDrawCur=null; freehandPts=null;

    // select / range_select 間では選択状態を維持。それ以外のモードに移る時はクリア

  };
}
[lwInput, crInput, fsInput, colorInput, fontSelect].forEach(inp=>{

/* ===================== 採番ロジック ===================== */
/* 保存済みPDFの再読込などで、あるページの次の採番数字をannotsの実データから
   再計算する（欠番があっても既存の最大番号+1にするため安全側に倒している） */
function recalcNextNumForPage(page){
  const nums = annots.filter(a=>a.page===page && a.kind==="weld").map(a=>a.number);
  nextNumByPage[page] = (nums.length ? Math.max(...nums) : 0) + 1;
}

function nextNumberFor(page){
  if (!(page in nextNumByPage)) nextNumByPage[page] = parseInt(startNumInput.value)||1;
  const n = nextNumByPage[page];
  nextNumByPage[page] = n+1;
  return n;
}

/* 指定したページ群について、そのページ上の溶接番号を詰め直す（deleteRenumberModeが
   "renumber"なら1から連番に、"keep"なら最大値+1をカウンタにセットするだけ）。
   削除時だけでなく、「移動」で該当ページから項目が居なくなった場合にも使う。 */
function renumberPagesAfterRemoval(affectedPages){
  affectedPages.forEach(page=>{
    const weldOnPage = annots.filter(a=>a.page===page && a.kind==="weld")
                              .sort((a,b)=>a.number-b.number);
    if (deleteRenumberMode === "renumber"){
      weldOnPage.forEach((a,i)=>{ a.number = i+1; });
      nextNumByPage[page] = weldOnPage.length+1;
    } else {
      // 「欠番のまま」でも、Python版と同様にカウンタは残った番号の最大値+1へ
      // （無ければ開始番号欄の値）に付け直す
      nextNumByPage[page] = weldOnPage.length
        ? Math.max(...weldOnPage.map(a=>a.number))+1
        : (parseInt(startNumInput.value)||1);
    }
  });
}

/* 削除処理の共通ヘルパー。deleteRenumberModeが"renumber"なら、削除で生じた
   欠番を詰めてページごとに1から振り直す。呼び出し側でpushUndo()は済ませておくこと。 */
function removeAnnotsWithRenumber(toRemove){
  const removeSet = new Set(toRemove);
  const affectedPages = new Set(toRemove.filter(a=>a.kind==="weld").map(a=>a.page));
  annots = annots.filter(a=>!removeSet.has(a));
  renumberPagesAfterRemoval(affectedPages);
}

document.getElementById("btnApplyStart").onclick = ()=>{
  const v = parseInt(startNumInput.value)||1;
  nextNumByPage[curPage] = v;
  setStatus(`このページの次の番号を ${v} に設定しました`);
};

document.getElementById("btnResetPage").onclick = ()=>{
  pushUndo();
  const pageAnnots = annots.filter(a=>a.page===curPage && a.kind==="weld")
                            .sort((a,b)=>a.number-b.number);
  pageAnnots.forEach((a,i)=>{ a.number = i+1; });
  nextNumByPage[curPage] = pageAnnots.length+1;
  redrawAnnotations();
  setStatus("このページの溶接番号を振り直しました");
};

/* ===================== undo / redo ===================== */
function snapshot(){
  return { annots: JSON.parse(JSON.stringify(annots)), nextNumByPage: JSON.parse(JSON.stringify(nextNumByPage)) };
}
function pushUndo(){
  undoStack.push(snapshot());
  redoStack = [];
  updateUndoRedoButtons();
  isDirty = true;
}
function restore(snap){
  annots = snap.annots;
  nextNumByPage = snap.nextNumByPage;
  selectedItems = [];
  redrawAnnotations();
}
function updateUndoRedoButtons(){
  document.getElementById("btnUndo").disabled = undoStack.length===0;
  document.getElementById("btnRedo").disabled = redoStack.length===0;
}
document.getElementById("btnUndo").onclick = ()=>{
  if (!undoStack.length) return;
  redoStack.push(snapshot());
  restore(undoStack.pop());
  updateUndoRedoButtons();
  isDirty = true;
  setStatus("元に戻しました");
};
document.getElementById("btnRedo").onclick = ()=>{
  if (!redoStack.length) return;
  undoStack.push(snapshot());
  restore(redoStack.pop());
  updateUndoRedoButtons();
  isDirty = true;
  setStatus("やり直しました");
};

/* ===================== キャンバス操作 ===================== */
function distToSegment(px,py, x1,y1, x2,y2){
  const dx=x2-x1, dy=y2-y1;
  const len2 = dx*dx+dy*dy;
  let t = len2===0 ? 0 : ((px-x1)*dx+(py-y1)*dy)/len2;
  t = Math.max(0, Math.min(1, t));
  const cx = x1+t*dx, cy = y1+t*dy;
  return Math.hypot(px-cx, py-cy);
}

/* 戻り値: {annot, type} type="end"(番号/テキスト本体) | "all"(引き出し線・単独線) | "line"(単独引き出し線モードの線) */
function hitTest(px, py){
  // ヒットの許容範囲はズームに応じてPDF座標系でのピクセル相当に換算
  const tol = 6/zoom;
  const pageAnnots = annots.filter(a=>a.page===curPage);

  // 1) まず番号/テキスト本体（丸・箱）へのヒットを優先判定
  for (let i=pageAnnots.length-1; i>=0; i--){
    const a = pageAnnots[i];
    if (isPathKind(a.kind)) continue;
    const dx = a.x-px, dy = a.y-py;
    const dist = Math.sqrt(dx*dx+dy*dy);
    const radius = a.kind==="weld" ? a.r+4 : Math.max(a.r, (a.text.length*a.fs*0.5))+6;
    if (dist <= radius) return {annot:a, type:"end"};
  }

  // 2) 次に引き出し線（番号に紐づくpoints、または単独引き出し線／図形の輪郭）へのヒットを判定
  for (let i=pageAnnots.length-1; i>=0; i--){
    const a = pageAnnots[i];
    let segs = null;
    if (isPathKind(a.kind)){
      segs = shapeBoundaryPoints(a);
    } else if (a.points && a.points.length){
      segs = [...a.points, [a.x, a.y]];
    }
    if (!segs || segs.length < 2) continue;
    for (let k=0;k<segs.length-1;k++){
      const [x1,y1]=segs[k], [x2,y2]=segs[k+1];
      if (distToSegment(px,py,x1,y1,x2,y2) <= tol+a.lw){
        return {annot:a, type: isPathKind(a.kind) ? "line" : "all"};
      }
    }
  }
  return null;
}

/* Python版の _nearest_on_page 相当：中心点との距離が最も近いアノテを探す（線分は見ない） */
function nearestOnPage(px, py, maxDistPx){
  const maxDist = (maxDistPx===undefined ? 60 : maxDistPx) / zoom; // 60画面px相当をPDF単位に換算
  const pageAnnots = annots.filter(a=>a.page===curPage && !isPathKind(a.kind));
  if (!pageAnnots.length) return null;
  let best = null, bestD = Infinity;
  for (const a of pageAnnots){
    const d = Math.hypot(a.x-px, a.y-py);
    if (d < bestD){ bestD = d; best = a; }
  }
  return (best && bestD <= maxDist) ? best : null;
}

function itemsInRect(pMin, pMax){
  const [x1,y1]=pMin, [x2,y2]=pMax;
  const xlo=Math.min(x1,x2), xhi=Math.max(x1,x2);
  const ylo=Math.min(y1,y2), yhi=Math.max(y1,y2);
  return annots.filter(a=>{
    if (a.page!==curPage) return false;
    if (isPathKind(a.kind)){
      return a.points.some(([px,py])=> px>=xlo && px<=xhi && py>=ylo && py<=yhi);
    }
    return a.x>=xlo && a.x<=xhi && a.y>=ylo && a.y<=yhi;
  });
}

function clientToPdf(e){
  const rect = annoCanvas.getBoundingClientRect();
  const cx = e.clientX - rect.left;
  const cy = e.clientY - rect.top;
  return curViewport.convertToPdfPoint(cx, cy);
}

function origPosOf(a){
  return isPathKind(a.kind)
    ? a.points.map(p=>[...p])
    : { x:a.x, y:a.y, points: a.points ? a.points.map(p=>[...p]) : null };
}
function applyDragDelta(a, orig, type, dx, dy){
  if (isPathKind(a.kind)){
    a.points = orig.map(([ox,oy])=>[ox+dx, oy+dy]);
    return;
  }
  a.x = orig.x + dx; a.y = orig.y + dy;
  if (type==="all" && orig.points){
    a.points = orig.points.map(([ox,oy])=>[ox+dx, oy+dy]);
  }
}
function syncStyleBarFrom(hit){
  if (!isPathKind(hit.kind)){
    lwInput.value = hit.lw; crInput.value = hit.r; fsInput.value = hit.fs; colorInput.value = hit.color;
    fontSelect.value = hit.font || "gothic";
  } else {
    lwInput.value = hit.lw; colorInput.value = hit.color;
  }
}
function startDragOn(hitObj, px, py, forceAll){
  const {annot, type} = hitObj;
  const isGroup = selectedItems.includes(annot) && selectedItems.length>1;
  if (!isGroup){ selectedItems = [annot]; syncStyleBarFrom(annot); }
  pushUndo();
  dragging = true;
  dragStartPdf = [px,py];
  dragOrigPositions = selectedItems.map(origPosOf);
  dragHitTypes = selectedItems.map(()=> (isGroup || forceAll) ? "all" : type);
  redrawAnnotations();
}

annoCanvas.addEventListener("mousedown", e=>{
  if (!pdfFiles.length) return;
  if (e.button !== 0) return;   // 中クリック等はパン操作に譲る
  if (!curViewport) return;     // ページ読み込み中（座標変換の基準がまだ古いページのまま）は無視
  const [px, py] = clientToPdf(e);

  // 基点指定コピー／移動：基点クリック待ち
  if (basePickMode){ confirmBasePick(px, py); return; }
  // 貼り付け位置クリック待ち
  if (pasteMode){ doPasteAt(px, py); return; }

  // Ctrl+クリック：個別に選択追加／解除（モード共通）
  if (e.ctrlKey){
    const h = hitTest(px, py);
    if (h){
      const idx = selectedItems.indexOf(h.annot);
      if (idx>=0) selectedItems.splice(idx,1); else selectedItems.push(h.annot);
      redrawAnnotations();
      setStatus(`${selectedItems.length}個を選択中`);
    }
    return;
  }

  if (mode === "add_weld" || mode === "add_text" || mode === "add_comment" || mode === "add_arrow_text"){
    // 既存アイテムにヒットしたらドラッグ移動へ
    if (!waitingStart && !numPolyMode){
      const h = hitTest(px, py);
      if (h){ startDragOn(h, px, py); return; }
    }

    // 折れ点モード中
    if (numPolyMode){
      if (e.shiftKey){
        numPolyPts.push([px,py]);
        redrawAnnotations();
        setStatus(`折れ点 ${numPolyPts.length} 個（Shift+クリックで追加／通常クリックかEnterで確定／Escで取消）`);
      } else {
        finishNumberOrText(mode, numPolyPts, px, py);
        numPolyMode = false; numPolyPts = []; numLineMouseCur = null;
      }
      return;
    }

    // 始点待ち中（終点 or 折れ点への移行）
    if (waitingStart){
      if (e.shiftKey){
        numPolyPts = [startPdf, [px,py]];
        numPolyMode = true;
        waitingStart = false; startPdf = null; startClient = null;
        redrawAnnotations();
        setStatus(`折れ点 ${numPolyPts.length} 個（Shift+クリックで追加／通常クリックかEnterで確定／Escで取消）`);
      } else {
        const dist = Math.hypot(e.clientX-startClient.x, e.clientY-startClient.y);
        const points = dist < 8 ? [] : [startPdf];
        waitingStart = false; startPdf = null; startClient = null; numLineMouseCur = null;
        finishNumberOrText(mode, points, px, py);
      }
      return;
    }

    // 1クリック目
    if (e.shiftKey){
      numPolyPts = [[px,py]];
      numPolyMode = true;
      redrawAnnotations();
      setStatus("折れ点 1 個（Shift+クリックで追加／通常クリックかEnterで確定／Escで取消）");
    } else {
      // 長押し判定用に記録。始点確定はmouseupで行う
      pressInfo = { time: performance.now(), clientX: e.clientX, clientY: e.clientY };
    }
    return;
  }
  if (mode === "delete"){
    const near = nearestOnPage(px, py);
    if (near){
      pushUndo();
      removeAnnotsWithRenumber([near]);
      redrawAnnotations();
      setStatus("削除しました");
    }
    return;
  }
  if (mode === "add_rect" || mode === "add_ellipse" || mode === "add_triangle"){
    shapeDrawStart = [px,py];
    shapeDrawCur = [px,py];
    return;
  }
  if (mode === "add_freehand"){
    freehandPts = [[px,py]];
    return;
  }
  if (mode === "range_select"){
    rangeSelecting = true;
    rangeStartPdf = [px,py];
    rangeCurPdf = [px,py];
    return;
  }
  if (mode === "select"){
    const near = nearestOnPage(px, py);
    if (!near){ setStatus("近くにアノテーションがありません"); return; }
    pushUndo();
    near.voided = !near.voided;
    redrawAnnotations();
    setStatus(near.voided ? "欠番にしました（もう一度クリックで解除）" : "欠番を解除しました");
  }
});

/* 採番/テキスト追加の確定処理。points は始点(+折れ点)の配列（終点は含まない） */
function finishNumberOrText(mode, points, endX, endY){
  if (mode === "add_weld"){
    pushUndo();
    const s = currentStyle();
    const num = nextNumberFor(curPage);
    annots.push({page:curPage, kind:"weld", x:endX, y:endY, number:num,
                 points: points.length ? points : undefined, ...s, voided:false});
    redrawAnnotations();
    setStatus(`溶接番号 ${num} を配置しました`);
  } else if (mode === "add_comment"){
    const text = window.prompt("メモ内容を入力してください（このコメントはPDF書き出し時に印刷されません）:", "");
    if (text === null || text.trim()===""){ redrawAnnotations(); return; }
    pushUndo();
    const s = currentStyle();
    annots.push({page:curPage, kind:"comment", x:endX, y:endY, text:text,
                 points: points.length ? points : undefined, ...s, voided:false});
    redrawAnnotations();
    setStatus("コメント（非印刷メモ）を追加しました");
  } else if (mode === "add_arrow_text"){
    if (!points.length){
      setStatus("矢印の先端位置と文字を置く位置を離してクリックしてください（1クリック目＝矢印の先／2クリック目＝文字位置）");
      redrawAnnotations();
      return;
    }
    const text = window.prompt("追加するテキスト:", "");
    if (text === null || text.trim()===""){ redrawAnnotations(); return; }
    pushUndo();
    const s = currentStyle();
    annots.push({page:curPage, kind:"arrow_text", x:endX, y:endY, text:text, points:points, ...s, voided:false});
    redrawAnnotations();
    setStatus("矢印付き文字を追加しました");
  } else {
    const text = window.prompt("追加するテキスト:", "");
    if (text === null || text.trim()===""){ redrawAnnotations(); return; }
    pushUndo();
    const s = currentStyle();
    annots.push({page:curPage, kind:"text", x:endX, y:endY, text:text,
                 points: points.length ? points : undefined, ...s, voided:false});
    redrawAnnotations();
    setStatus("テキストを追加しました");
  }
}

annoCanvas.addEventListener("dblclick", e=>{
  if (mode==="select"){
    if (!curViewport) return;
    const [px, py] = clientToPdf(e);
    const h = hitTest(px, py);
    if (!h || isPathKind(h.annot.kind)) return;
    const hit = h.annot;
    if (hit.kind==="weld"){
      const input = window.prompt("番号を編集:", String(hit.number));
      if (input===null) return;
      const v = parseInt(input, 10);
      if (!Number.isFinite(v) || v<1) return;
      pushUndo();
      hit.number = v;
      redrawAnnotations();
      setStatus(`番号を ${v} に変更しました`);
    } else {
      const input = window.prompt("テキストを編集:", hit.text);
      if (input===null || input.trim()==="") return;
      pushUndo();
      hit.text = input;
      redrawAnnotations();
      setStatus("テキストを変更しました");
    }
  }
});
function pushUndo_lineFinish(){
  // 確定直前の状態(線追加前)を積みたいが、簡易実装のため追加後スナップショットとの整合を保つ形でここではundo対象は「追加操作そのもの」とする
  const snap = snapshot();
  // 直前状態を再現するため、線を除いた状態を積む
  const withoutLast = { annots: snap.annots.slice(0,-1), nextNumByPage: snap.nextNumByPage };
  undoStack.push(withoutLast);
  redoStack = [];
  updateUndoRedoButtons();
}

annoCanvas.addEventListener("mousemove", e=>{
  // PDFがまだ読み込まれていない(=curViewportが無い)うちにマウスを動かすと
  // clientToPdf()内のcurViewport.convertToPdfPoint()でエラーになっていたため、
  // その場合は何もせず抜ける（コンソールにエラーが大量に出ていた原因）
  if (!curViewport) return;
  const [px, py] = clientToPdf(e);

  if (pasteMode){
    updatePastePreview(px,py); return;
  }

  // 採番/テキスト追加モード：長押しドラッグを判定し、範囲選択プレビューへ切替
  if ((mode==="add_weld" || mode==="add_text" || mode==="add_comment" || mode==="add_arrow_text") && pressInfo && !waitingStart && !numPolyMode && !dragging){
    const dist = Math.hypot(e.clientX-pressInfo.clientX, e.clientY-pressInfo.clientY);
    const elapsed = performance.now() - pressInfo.time;
    if (!numDragRect && dist > DRAG_THRESHOLD_PX && elapsed >= LONG_PRESS_MS){
      numDragRect = true;
      const rect = annoCanvas.getBoundingClientRect();
      numRangeStartPdf = curViewport.convertToPdfPoint(pressInfo.clientX-rect.left, pressInfo.clientY-rect.top);
    }
    if (numDragRect){
      numRangeCurPdf = [px,py];
      redrawAnnotations();
      return;
    }
  }

  // 採番/テキスト追加モード：始点/折れ点からのラバーバンド線プレビュー
  if ((mode==="add_weld" || mode==="add_text" || mode==="add_comment" || mode==="add_arrow_text") && (waitingStart || numPolyMode)){
    numLineMouseCur = [px,py];
    redrawAnnotations();
    return;
  }

  if ((mode==="add_rect" || mode==="add_ellipse" || mode==="add_triangle") && shapeDrawStart){
    shapeDrawCur = [px,py];
    redrawAnnotations();
    return;
  }
  if (mode==="add_freehand" && freehandPts){
    const last = freehandPts[freehandPts.length-1];
    if (Math.hypot(px-last[0], py-last[1]) > (2/zoom)){
      freehandPts.push([px,py]);
      redrawAnnotations();
    }
    return;
  }
  if (mode==="range_select" && rangeSelecting){
    rangeCurPdf = [px,py];
    redrawAnnotations();
    return;
  }
  if (dragging && selectedItems.length){
    const dx = px - dragStartPdf[0], dy = py - dragStartPdf[1];
    selectedItems.forEach((a,i)=>{
      applyDragDelta(a, dragOrigPositions[i], dragHitTypes[i], dx, dy);
    });
    redrawAnnotations();
  }
});
window.addEventListener("mouseup", e=>{
  if (e.button !== 0) return;
  dragging = false; dragOrigPositions = null; dragHitTypes = null;

  if (numDragRect){
    numDragRect = false; pressInfo = null;
    if (numRangeStartPdf && numRangeCurPdf){
      const found = itemsInRect(numRangeStartPdf, numRangeCurPdf);
      selectedItems = found;
      setStatus(`${found.length} 個のアイテムを選択しました`);
    }
    numRangeStartPdf = null; numRangeCurPdf = null;
    redrawAnnotations();
    return;
  }
  if (pressInfo && (mode==="add_weld" || mode==="add_text" || mode==="add_comment" || mode==="add_arrow_text") && !waitingStart && !numPolyMode){
    // 長押しにならなかった短いクリック → 始点を確定し終点待ちへ
    if (selectedItems.length){ selectedItems = []; }
    waitingStart = true;
    startClient = { x: pressInfo.clientX, y: pressInfo.clientY };
    const rect = annoCanvas.getBoundingClientRect();
    startPdf = curViewport.convertToPdfPoint(pressInfo.clientX-rect.left, pressInfo.clientY-rect.top);
    pressInfo = null;
    redrawAnnotations();
    const hint = mode==="add_arrow_text" ? "矢印の先端を配置しました／クリックで文字位置を確定／Escで取消"
                                          : "始点を配置しました／クリックで終点確定（同位置なら線なし）／Shift+クリックで折れ点／Escで取消";
    setStatus(hint);
    return;
  }
  pressInfo = null;

  if (shapeDrawStart){
    const moved = shapeDrawCur && Math.hypot(shapeDrawCur[0]-shapeDrawStart[0], shapeDrawCur[1]-shapeDrawStart[1]) > (2/zoom);
    if (moved){
      pushUndo();
      const s = currentStyle();
      const kind = mode.replace("add_","");
      annots.push({page:curPage, kind, points:[shapeDrawStart, shapeDrawCur], color:s.color, lw:s.lw, voided:false});
      setStatus("図形を追加しました");
    }
    shapeDrawStart = null; shapeDrawCur = null;
    redrawAnnotations();
    return;
  }
  if (freehandPts){
    if (freehandPts.length >= 2){
      pushUndo();
      const s = currentStyle();
      annots.push({page:curPage, kind:"freehand", points:freehandPts, color:s.color, lw:s.lw, voided:false});
      setStatus("フリーハンド図形を追加しました");
    }
    freehandPts = null;
    redrawAnnotations();
    return;
  }

  if (rangeSelecting){
    rangeSelecting = false;
    if (rangeStartPdf && rangeCurPdf){
      const found = itemsInRect(rangeStartPdf, rangeCurPdf);
      selectedItems = found;
      setStatus(`${found.length} 個のアイテムを選択しました`);
    }
    rangeStartPdf = null; rangeCurPdf = null;
    redrawAnnotations();
  }
});

/* ===================== 右クリックメニュー：基点指定コピー／移動 ===================== */
function hideContextMenu(){
  if (paletteMenuEl){ paletteMenuEl.remove(); paletteMenuEl = null; }
}
function showContextMenu(x, y, items){
  hideContextMenu();
  const menu = document.createElement("div");
  menu.style.cssText = `position:fixed;left:${x}px;top:${y}px;background:#3c3c3c;border:1px solid #555;
    border-radius:4px;padding:4px 0;z-index:9999;min-width:180px;box-shadow:0 4px 14px rgba(0,0,0,.5);font-size:12px;`;
  items.forEach(it=>{
    const row = document.createElement("div");
    row.textContent = it.label;
    row.style.cssText = `padding:7px 14px;color:${it.enabled?'#fff':'#777'};cursor:${it.enabled?'pointer':'default'};`;
    if (it.enabled){
      row.addEventListener("mouseenter", ()=> row.style.background="#555");
      row.addEventListener("mouseleave", ()=> row.style.background="");
      row.addEventListener("click", ()=>{ hideContextMenu(); it.onClick(); });
    }
    menu.appendChild(row);
  });
  document.body.appendChild(menu);
  paletteMenuEl = menu;
  setTimeout(()=>{ document.addEventListener("click", hideContextMenu, {once:true}); }, 0);
}

annoCanvas.addEventListener("contextmenu", e=>{
  if (!pdfFiles.length) return;
  e.preventDefault();
  if (!curViewport) return;     // ページ読み込み中は無視
  const [px, py] = clientToPdf(e);

  if (mode === "select"){
    const near = nearestOnPage(px, py);
    if (near && near.voided){
      pushUndo();
      near.voided = false;
      redrawAnnotations();
      setStatus("欠番を解除しました");
    }
    return;
  }

  const h = hitTest(px, py);
  if (h && !selectedItems.includes(h.annot)) selectedItems = [h.annot];
  redrawAnnotations();
  const hasSel = selectedItems.length > 0;
  const menuItems = [
    { label:"基点を指定してコピー", enabled:hasSel, onClick:()=>startBasePick("copy") },
    { label:"削除", enabled:hasSel, onClick:()=>{
        pushUndo(); removeAnnotsWithRenumber(selectedItems); selectedItems=[]; redrawAnnotations(); setStatus("削除しました");
      } },
    { label:"基点を指定して移動", enabled:hasSel, onClick:()=>startBasePick("move") },
  ];
  // 貼り付け位置クリック待ち（pasteMode）の間だけ「基点を指定して貼り付け」を表示する
  if (pasteMode){
    menuItems.push({ label:"基点を指定して貼り付け", enabled:true, onClick:()=>doPasteAt(px, py) });
  }
  menuItems.push({ label:"キャンセル", enabled:true, onClick:()=>{ selectedItems=[]; redrawAnnotations(); } });
  showContextMenu(e.clientX, e.clientY, menuItems);
});

function startBasePick(kind){
  if (!selectedItems.length){ setStatus("対象を選択してください"); return; }
  basePickMode = kind;
  setStatus(`${selectedItems.length}個を選択中／基点をクリックしてください（Escで取消）`);
  showToast("基点を選択してください");
}

function offsetDataFor(a, bx, by){
  if (isPathKind(a.kind)){
    return { kind:a.kind, color:a.color, lw:a.lw,
              pointsOff: a.points.map(([x,y])=>[x-bx, y-by]) };
  }
  return {
    kind: a.kind, text: a.text, color: a.color, lw: a.lw, r: a.r, fs: a.fs, font: a.font,
    xOff: a.x - bx, yOff: a.y - by,
    pointsOff: a.points ? a.points.map(([x,y])=>[x-bx, y-by]) : null,
  };
}

function confirmBasePick(bx, by){
  const sel = selectedItems.slice();
  if (!sel.length){ basePickMode=null; return; }

  if (basePickMode === "copy"){
    baseClipboard = sel.map(a=>offsetDataFor(a, bx, by));
    pasteWasMove = false; moveUndoIndex = null;
    basePickMode = null; pasteMode = true;
    setStatus(`${sel.length}個をコピー／貼り付け位置をクリック（Escで取消）`);
  } else if (basePickMode === "move"){
    pushUndo();
    moveUndoIndex = undoStack.length - 1;
    baseClipboard = sel.map(a=>offsetDataFor(a, bx, by));
    // 移動元のページから溶接番号が居なくなることによる欠番も、削除時と同様に詰め直す
    // （「取消時の番号」設定が"詰める"なら1から連番へ、"欠番のまま"ならカウンタだけ調整）
    const affectedPages = new Set(sel.filter(a=>a.kind==="weld").map(a=>a.page));
    annots = annots.filter(a=>!sel.includes(a));
    renumberPagesAfterRemoval(affectedPages);
    selectedItems = [];
    pasteWasMove = true;
    basePickMode = null; pasteMode = true;
    redrawAnnotations();
    setStatus(`${sel.length}個を移動中／移動先をクリック（Escで取消）`);
  }
}

function clearPastePreview(){ /* 描画はredrawAnnotations内でpasteMode状態を見て行うため、ここでは何もしない */ }

function updatePastePreview(px, py){
  redrawAnnotations();
  if (!baseClipboard.length) return;
  annoCtx.save();
  annoCtx.strokeStyle = "#cc44ff"; annoCtx.setLineDash([4,3]);
  baseClipboard.forEach(d=>{
    if (isPathKind(d.kind)){
      annoCtx.beginPath();
      d.pointsOff.forEach(([ox,oy],i)=>{
        const [vx,vy] = curViewport.convertToViewportPoint(px+ox, py+oy);
        if (i===0) annoCtx.moveTo(vx,vy); else annoCtx.lineTo(vx,vy);
      });
      annoCtx.lineWidth = d.lw; annoCtx.stroke();
      return;
    }
    const nx = px + d.xOff, ny = py + d.yOff;
    if (d.pointsOff){
      annoCtx.beginPath();
      const full = [...d.pointsOff.map(([ox,oy])=>[px+ox,py+oy]), [nx,ny]];
      full.forEach(([fx,fy],i)=>{
        const [vx,vy] = curViewport.convertToViewportPoint(fx,fy);
        if (i===0) annoCtx.moveTo(vx,vy); else annoCtx.lineTo(vx,vy);
      });
      annoCtx.lineWidth = d.lw; annoCtx.stroke();
    }
    const [vx,vy] = curViewport.convertToViewportPoint(nx, ny);
    annoCtx.setLineDash([]);
    if (d.kind==="weld"){
      annoCtx.beginPath(); annoCtx.arc(vx,vy,d.r,0,Math.PI*2); annoCtx.stroke();
      annoCtx.fillStyle="#cc44ff"; annoCtx.font=`${d.fs}px ${cssFontFamily(d.font)}`;
      annoCtx.textAlign="center"; annoCtx.textBaseline="middle";
      annoCtx.fillText("?", vx, vy+1);
    } else {
      annoCtx.font=`${d.fs}px ${cssFontFamily(d.font)}`;
      const tw = annoCtx.measureText(d.text).width, bw=tw+12, bh=d.fs+10;
      annoCtx.strokeRect(vx-bw/2, vy-bh/2, bw, bh);
    }
    annoCtx.setLineDash([4,3]);
  });
  annoCtx.restore();
}

function doPasteAt(px, py){
  pushUndo();
  const created = [];
  baseClipboard.forEach(d=>{
    if (isPathKind(d.kind)){
      const points = d.pointsOff.map(([ox,oy])=>[px+ox, py+oy]);
      const na = { page:curPage, kind:d.kind, color:d.color, lw:d.lw, voided:false, points };
      annots.push(na); created.push(na);
      return;
    }
    const na = {
      page: curPage, kind: d.kind, color: d.color, lw: d.lw, r: d.r, fs: d.fs, font: d.font, voided: false,
      x: px + d.xOff, y: py + d.yOff,
      points: d.pointsOff ? d.pointsOff.map(([ox,oy])=>[px+ox, py+oy]) : undefined,
    };
    if (d.kind === "weld") na.number = nextNumberFor(curPage);
    else na.text = d.text;
    annots.push(na); created.push(na);
  });
  selectedItems = created;
  pasteMode = false; baseClipboard = []; pasteWasMove = false; moveUndoIndex = null;
  redrawAnnotations();
  setStatus(`${created.length}個を貼り付けました`);
}

/* ===================== 中クリックドラッグでパン ===================== */
canvasWrap.addEventListener("mousedown", e=>{
  if (e.button === 1){
    e.preventDefault();
    panning = true;
    panStart = { x:e.clientX, y:e.clientY };
    panAccumX = 0; panAccumY = 0;
    canvasWrap.style.cursor = "grabbing";
  }
});
window.addEventListener("mousemove", e=>{
  if (panning && panStart){
    const dx = e.clientX - panStart.x, dy = e.clientY - panStart.y;
    panStart = { x:e.clientX, y:e.clientY };
    panAccumX += dx; panAccumY += dy;
    // 15ピクセル移動ごとに1スクロール（Python版と同じ低速・段階的パン）
    const STEP = 15;
    if (Math.abs(panAccumX) >= STEP){
      canvasWrap.scrollLeft -= panAccumX;
      panAccumX = 0;
    }
    if (Math.abs(panAccumY) >= STEP){
      canvasWrap.scrollTop -= panAccumY;
      panAccumY = 0;
    }
  }
});
window.addEventListener("mouseup", e=>{
  if (e.button === 1 && panning){
    panning = false;
    panStart = null;
    canvasWrap.style.cursor = "";
  }
});
canvasWrap.addEventListener("auxclick", e=>{ if (e.button===1) e.preventDefault(); });

/* ===================== ホイールでズーム（カーソル位置中心） ===================== */
canvasWrap.addEventListener("wheel", async (e)=>{
  if (!pdfFiles.length) return;
  e.preventDefault();
  const direction = e.deltaY < 0 ? 1 : -1;
  let idx = 0, bestDiff = Infinity;
  ZOOM_LEVELS.forEach((z,i)=>{ const d=Math.abs(z-zoom); if (d<bestDiff){ bestDiff=d; idx=i; } });
  const newIdx = Math.max(0, Math.min(ZOOM_LEVELS.length-1, idx+direction));
  if (ZOOM_LEVELS[newIdx] === zoom) return;

  const rect = canvasWrap.getBoundingClientRect();
  const localX = e.clientX - rect.left, localY = e.clientY - rect.top;
  const cxBefore = canvasWrap.scrollLeft + localX;
  const cyBefore = canvasWrap.scrollTop + localY;
  const oldZoom = zoom;
  zoom = ZOOM_LEVELS[newIdx];
  await renderPage();
  const scale = zoom / oldZoom;
  canvasWrap.scrollLeft = cxBefore*scale - localX;
  canvasWrap.scrollTop  = cyBefore*scale - localY;
  setStatus(`ズーム: ${Math.round(zoom*100)}%`);
}, {passive:false});

document.addEventListener("keydown", e=>{
  if (!pdfFiles.length) return;
  if (e.key==="Escape"){
    cancelCurrentAction();
  }
  if (e.key==="Enter"){
    if (numPolyMode && numLineMouseCur){
      e.preventDefault();
      const endPt = numLineMouseCur;
      const pts = numPolyPts;
      numPolyMode=false; numPolyPts=[]; numLineMouseCur=null;
      finishNumberOrText(mode, pts, endPt[0], endPt[1]);
    }
  }
  if (e.key==="Delete" || e.key==="Backspace"){
    if (selectedItems.length){
      e.preventDefault();
      pushUndo();
      removeAnnotsWithRenumber(selectedItems);
      selectedItems = [];
      redrawAnnotations();
      setStatus("選択中の項目を削除しました");
    }
  }
  if (!e.ctrlKey && (e.key==="v" || e.key==="V")){
    if (selectedItems.length){
      pushUndo();
      selectedItems.forEach(a=>{ if (!isPathKind(a.kind)) a.voided = !a.voided; });
      redrawAnnotations();
      setStatus("欠番状態を切り替えました");
    }
  }
  if (e.ctrlKey && e.key==="z"){ e.preventDefault(); document.getElementById("btnUndo").click(); }
  if (e.ctrlKey && e.key==="y"){ e.preventDefault(); document.getElementById("btnRedo").click(); }
  if (e.ctrlKey && (e.key==="c" || e.key==="C")){
    if (selectedItems.length){
      e.preventDefault();
      clipboard = selectedItems.map(a=>JSON.parse(JSON.stringify(a)));
      setStatus(`${clipboard.length} 個をコピーしました`);
    }
  }
  if (e.ctrlKey && (e.key==="x" || e.key==="X")){
    if (selectedItems.length){
      e.preventDefault();
      clipboard = selectedItems.map(a=>JSON.parse(JSON.stringify(a)));
      pushUndo();
      removeAnnotsWithRenumber(selectedItems);
      selectedItems = [];
      redrawAnnotations();
      setStatus(`${clipboard.length} 個を切り取りました`);
    }
  }
  if (e.ctrlKey && (e.key==="v" || e.key==="V")){
    if (clipboard.length){
      e.preventDefault();
      pushUndo();
      const OFFSET = 15;
      const pasted = clipboard.map(a=>{
        const copy = JSON.parse(JSON.stringify(a));
        copy.page = curPage;
        if (isPathKind(copy.kind)){
          copy.points = copy.points.map(([x,y])=>[x+OFFSET, y-OFFSET]);
        } else {
          copy.x += OFFSET; copy.y -= OFFSET;
          if (copy.points) copy.points = copy.points.map(([x,y])=>[x+OFFSET, y-OFFSET]);
        }
        if (copy.kind === "weld"){
          copy.number = nextNumberFor(curPage);
        }
        return copy;
      });
      annots.push(...pasted);
      selectedItems = pasted;
      // 次回のCtrl+Vでさらにずらして貼れるよう、クリップボード側の基準位置も更新
      clipboard = pasted.map(a=>JSON.parse(JSON.stringify(a)));
      redrawAnnotations();
      setStatus(`${pasted.length} 個を貼り付けました`);
    }
  }
});

/* ===================== 日本語フォント（保存時に埋め込み） ===================== */
// WOFF2形式のフォントをそのままpdf-libに渡すと、圧縮フォーマットのまま
// サブセット化(埋め込み文字を絞り込む処理)が行われた際に、数字などの一部の
// 文字の輪郭データが壊れて「見た目には存在するのに表示されない」状態になる
// ことが確認されたため、埋め込み前に必ず生のTTF形式へ展開している。
const JP_FONT_URLS = {
  gothic: "https://cdn.jsdelivr.net/npm/@fontsource/noto-sans-jp/files/noto-sans-jp-japanese-400-normal.woff2",
  mincho: "https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-jp/files/noto-serif-jp-japanese-400-normal.woff2"
};
let jpFontTtfCache = {};
let woff2ReadyPromise = null;
function ensureWoff2Ready(){
  if (!woff2ReadyPromise){
    woff2ReadyPromise = new Promise(resolve=>{
      if (typeof Module === "undefined"){ resolve(); return; }
      if (Module.calledRun){ resolve(); return; }
      Module.onRuntimeInitialized = resolve;
    });
  }
  return woff2ReadyPromise;
}
async function woff2ToTtfBytes(woff2Buf){
  await ensureWoff2Ready();
  if (typeof Module === "undefined" || typeof Module.decompress !== "function"){
    throw new Error("WOFF2展開モジュールの読み込みに失敗しました（ネットワーク接続を確認してください）");
  }
  const result = Module.decompress(new Uint8Array(woff2Buf));
  if (result === false) throw new Error("WOFF2フォントの展開に失敗しました");
  return result;
}
async function fetchJpFontBytes(key){
  if (jpFontTtfCache[key]) return jpFontTtfCache[key];
  const res = await fetch(JP_FONT_URLS[key]);
  if (!res.ok) throw new Error(`日本語フォント(${key})の取得に失敗しました`);
  const woff2Buf = await res.arrayBuffer();
  const ttfBytes = await woff2ToTtfBytes(woff2Buf);
  jpFontTtfCache[key] = ttfBytes;
  return ttfBytes;
}
