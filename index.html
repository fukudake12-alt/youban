/* ===================== PDF標準アノテーション生成ヘルパー =====================
 * 変更理由:
 *   これまでは page.drawText()/drawLine()/drawEllipse() でページの内容(コンテンツ
 *   ストリーム)へ直接図形を焼き込んでいたため、一度保存したPDFを再び開いて
 *   アノテーションを移動・保存すると「古い位置の図形」がページに残ったまま
 *   「新しい位置の図形」が追加され、二重表示（焼き付き）が発生していた。
 *   これを解消するため、溶接番号などをPDF標準の「アノテーション」オブジェクト
 *   （Circle / Line / FreeText）として保存する方式に変更する。
 *   保存の度に、本ツールが過去に生成したアノテーション（識別のため /NM に
 *   "WT-" 接頭辞を付与）をページから全て取り除いてから、現在の編集内容で
 *   作り直すため、何度保存を繰り返しても重複・焼き付きが発生しない。
 * 補足:
 *   Acrobat等の一般的なビューアは、アノテーションに外観ストリーム(/AP)が
 *   無いとビューア標準の簡易な見た目で表示してしまうため、円・線・文字は
 *   いずれも専用の外観ストリームを自前で描画して埋め込んでいる。
 * ================================================================== */

function pdfEscapeText(s){
  // PDF文字列リテラル( ... )の中では ( ) \ が特別な意味を持つためエスケープする
  return String(s).replace(/\\/g,"\\\\").replace(/\(/g,"\\(").replace(/\)/g,"\\)");
}

function colorArr(col){
  // pdf-libのrgb()オブジェクト({red,green,blue})を、コンテンツストリームで使う
  // 数値配列 [r,g,b] (0〜1) に変換する
  return [col.red, col.green, col.blue];
}

let wtAnnotSeq = 0; // アノテーション識別名(/NM)の重複防止用連番（保存処理全体で共有）

// 円アノテーション（溶接番号の丸）。欠番時の斜線もここに含めて1オブジェクトにまとめることで、
// Acrobat上で選択できる要素を不必要に増やさないようにしている。
// /Rotate があるページでは斜線が正しい向きになるよう、Form自体をrotAngle分回転させる
// （真円は回転しても見た目が変わらないため、この回転を加えても支障はない）。
function buildCircleAnnot(doc, {x, y, r, lw, col, voided, rotAngle}){
  const ctx = doc.context;
  const pad = lw/2 + 1;
  const bbox = [-r-pad, -r-pad, r+pad, r+pad]; // 正方形なので90度単位の回転でサイズは変わらない
  const k = 0.5523, rk = r*k; // ベジェ曲線4本で正円を近似するための定数
  const [cr,cg,cb] = colorArr(col);
  let content = `q\n${lw} w\n${cr} ${cg} ${cb} RG\n1 1 1 rg\n`
    + `${r} 0 m\n${r} ${rk} ${rk} ${r} 0 ${r} c\n${-rk} ${r} ${-r} ${rk} ${-r} 0 c\n`
    + `${-r} ${-rk} ${-rk} ${-r} 0 ${-r} c\n${rk} ${-r} ${r} ${-rk} ${r} 0 c\nB\n`;
  if (voided){
    content += `${-r*0.75} 0 m\n${r*0.75} 0 l\nS\n`;
  }
  content += "Q";
  const th = (rotAngle||0) * Math.PI/180;
  const cos = Math.cos(th), sin = Math.sin(th);
  const apStream = ctx.stream(content, {
    Type:"XObject", Subtype:"Form", FormType:1,
    BBox:bbox, Matrix:[cos,sin,-sin,cos,0,0], Resources:{},
  });
  const apRef = ctx.register(apStream);
  const dict = ctx.obj({
    Type:"Annot", Subtype:"Circle",
    Rect:[x+bbox[0], y+bbox[1], x+bbox[2], y+bbox[3]],
    C:[cr,cg,cb], IC:[1,1,1], BS:{W:lw},
    NM: PDFHexString.fromText(`WT-${wtAnnotSeq++}`), F:4, // F:4 = Print（印刷時にも表示する）
    AP:{N:apRef},
  });
  return ctx.register(dict);
}

// 引き出し線1区間ぶんのLineアノテーション。
// 座標は元々pdf.jsのビューポート変換でページの回転を考慮済みの値のため、
// ここで追加の回転補正は行わない（従来のdrawLineと同じ扱い）。
function buildLineAnnot(doc, {x1, y1, x2, y2, lw, col}){
  const ctx = doc.context;
  const pad = lw/2 + 1;
  const minx = Math.min(x1,x2)-pad, maxx = Math.max(x1,x2)+pad;
  const miny = Math.min(y1,y2)-pad, maxy = Math.max(y1,y2)+pad;
  const [cr,cg,cb] = colorArr(col);
  const content = `q\n${lw} w\n${cr} ${cg} ${cb} RG\n${x1} ${y1} m\n${x2} ${y2} l\nS\nQ`;
  const apStream = ctx.stream(content, {
    Type:"XObject", Subtype:"Form", FormType:1,
    BBox:[minx,miny,maxx,maxy], Resources:{},
  });
  const apRef = ctx.register(apStream);
  const dict = ctx.obj({
    Type:"Annot", Subtype:"Line",
    Rect:[minx,miny,maxx,maxy],
    L:[x1,y1,x2,y2], C:[cr,cg,cb], BS:{W:lw},
    NM: PDFHexString.fromText(`WT-${wtAnnotSeq++}`), F:4,
    AP:{N:apRef},
  });
  return ctx.register(dict);
}

// 溶接番号の文字（円の上に重ねる番号のみ、枠なし）と、
// テキスト注記（白背景の矩形＋枠線＋文字、欠番時は斜線つき）の両方をこの関数で生成する。
// ページに/Rotateが設定されている場合、Formの/Matrixで文字を回転させることで、
// 従来の page.drawText({rotate:...}) と同じ見た目を「移動可能なアノテーション」として再現する。
function buildFreeTextAnnot(doc, {x, y, text, fs, font, col, rotAngle, box, voided}){
  const ctx = doc.context;
  const th = (rotAngle||0) * Math.PI/180;
  const cos = Math.cos(th), sin = Math.sin(th);
  const tw = font.widthOfTextAtSize(text, fs);
  const tox = -tw/2, toy = -fs*0.35; // ベースライン位置の補正（中央揃え用）
  const [cr,cg,cb] = colorArr(col);
  let localBBox, contentBody;
  if (box){
    // テキスト注記：白背景の矩形＋枠線＋文字（斜線・矩形もMatrixで一緒に回転させるため
    // ここではすべて未回転のローカル座標で記述する）
    const bw = tw+12, bh = fs+10;
    localBBox = [-bw/2, -bh/2, bw/2, bh/2];
    contentBody = `q\n1 w\n${cr} ${cg} ${cb} RG\n1 1 1 rg\n${-bw/2} ${-bh/2} ${bw} ${bh} re\nB\n`
      + `${cr} ${cg} ${cb} rg\nBT\n/F1 ${fs} Tf\n${tox} ${toy} Td\n${font.encodeText(text).toString()} Tj\nET\n`;
    if (voided){
      contentBody += `${-bw/2+2} 0 m\n${bw/2-2} 0 l\nS\n`;
    }
    contentBody += "Q";
  } else {
    // 溶接番号の文字のみ（背景・枠なし）
    const padT = 2;
    localBBox = [tox-padT, toy-padT, tox+tw+padT, toy+fs+padT];
    contentBody = `q\n${cr} ${cg} ${cb} rg\nBT\n/F1 ${fs} Tf\n${tox} ${toy} Td\n${font.encodeText(text).toString()} Tj\nET\nQ`;
  }
  // 未回転のBBoxをMatrixで回転させた後の軸並行外接矩形を求め、それをそのままRectに使うことで
  // 拡大縮小のズレなく「回転した見た目」をアノテーションの矩形にぴったり収める
  function applyM(px,py){ return [px*cos - py*sin, px*sin + py*cos]; }
  const corners = [[localBBox[0],localBBox[1]],[localBBox[2],localBBox[1]],[localBBox[2],localBBox[3]],[localBBox[0],localBBox[3]]].map(([px,py])=>applyM(px,py));
  const xs = corners.map(c=>c[0]), ys = corners.map(c=>c[1]);
  const minx = Math.min(...xs), maxx = Math.max(...xs), miny = Math.min(...ys), maxy = Math.max(...ys);

  const apStream = ctx.stream(contentBody, {
    Type:"XObject", Subtype:"Form", FormType:1,
    BBox: localBBox, Matrix:[cos,sin,-sin,cos,0,0],
    Resources:{ Font:{ F1: font.ref } },
  });
  const apRef = ctx.register(apStream);
  const dict = ctx.obj({
    Type:"Annot", Subtype:"FreeText",
    Rect:[x+minx, y+miny, x+maxx, y+maxy],
    Contents: PDFHexString.fromText(text),
    DA: PDFHexString.fromText(`${cr} ${cg} ${cb} rg /F1 ${fs} Tf`),
    NM: PDFHexString.fromText(`WT-${wtAnnotSeq++}`), F:4,
    AP:{N:apRef},
  });
  return ctx.register(dict);
}

// ページの既存アノテーションのうち、本ツール由来のもの(/NMが"WT-"で始まるもの)を取り除いた
// 「残すべき参照配列」を返す。他アプリ／他者が付けた注釈はそのまま保持する。
function keepNonToolAnnotRefs(ctx, page){
  const existingRef = page.node.get(PDFName.of("Annots"));
  if (!existingRef) return [];
  const arr = ctx.lookup(existingRef);
  if (!arr || typeof arr.size !== "function") return [];
  const kept = [];
  for (let i=0;i<arr.size();i++){
    const ref = arr.get(i);
    try{
      const dict = ctx.lookup(ref);
      const nm = dict.get(PDFName.of("NM"));
      const nmStr = (nm && nm.decodeText) ? nm.decodeText() : "";
      if (!nmStr.startsWith("WT-")) kept.push(ref);
    }catch(e){
      kept.push(ref); // 形式が読み取れないものは念のため残す
    }
  }
  return kept;
}

/* ===================== ファイル保存（自動ダウンロード方式） ===================== */
/* 「名前を付けて保存」ダイアログ(showSaveFilePicker)は、環境によってはセキュリティ
 * ソフト等の影響で書き込みが失敗し0バイトのファイルになる不具合が確認されたため、
 * 確実性を優先してブラウザの標準ダウンロード機能（自動でダウンロードフォルダへ保存）
 * に統一する。保存先が分かりにくいという点は、ステータス表示で明示して補う。 */
function downloadBlob(blob, suggestedName){
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = suggestedName;
  document.body.appendChild(link);
  link.click();
  link.remove();
  URL.revokeObjectURL(url);
}

async function saveFiles(targetFiles){
  if (!targetFiles.length) return;
  const prefix = await askSavePrefix();
  if (prefix === null){ setStatus("保存をキャンセルしました"); return; }

  const nameFor = pf => `${prefix ? prefix+"_" : ""}${pf.name.replace(/\.pdf$/i, "")}.pdf`;

  setStatus("PDFを書き出しています...");
  const warnings = [];
  const savedNames = [];
  try{
    let savedCount = 0;
    for (let fi=0; fi<targetFiles.length; fi++){
      const pf = targetFiles[fi];
      const fileAnnots = annots.filter(a=>a.page>=pf.offset && a.page<pf.offset+pf.pageCount);

      const doc = await PDFDocument.load(pf.bytes);
      const helvFont = await doc.embedFont(StandardFonts.Helvetica);
      const courierFont = await doc.embedFont(StandardFonts.Courier);

      const neededJpKeys = new Set(
        fileAnnots.filter(a=>!isPathKind(a.kind) && a.kind!=="comment" && !["helv","courier"].includes(a.font||"gothic")).map(a=>a.font||"gothic")
      );
      // Helvetica/Courier専用でも日本語文字が混じっていれば自動フォールバックできるよう常にgothicは候補に含める
      if (fileAnnots.some(a=>!isPathKind(a.kind) && a.kind!=="comment" && ["helv","courier"].includes(a.font||"gothic") && /[^\x00-\xFF]/.test(String(a.text||a.number||"")))){
        neededJpKeys.add("gothic");
      }

      const jpFonts = {};
      if (neededJpKeys.size){
        try{ doc.registerFontkit(fontkit); }catch(e){ /* 既に登録済みの場合は無視 */ }
        for (const key of neededJpKeys){
          try{
            const bytes = await fetchJpFontBytes(key);
            jpFonts[key] = await doc.embedFont(bytes, {subset:true});
          }catch(err){
            console.warn(err);
            warnings.push(`${pf.name}: 日本語フォント(${key})の埋め込みに失敗したため、Helveticaで代用しました（インターネット接続を確認してください）`);
          }
        }
      }

      function pickFont(a, text){
        const key = a.font || "gothic";
        if (key === "courier"){
          return /[^\x00-\xFF]/.test(text) ? (jpFonts["gothic"] || helvFont) : courierFont;
        }
        if (key !== "helv") return jpFonts[key] || helvFont;
        if (/[^\x00-\xFF]/.test(text)) return jpFonts["gothic"] || helvFont;
        return helvFont;
      }

      const pages = doc.getPages();

      // 変更点: ページ本体へ直接描画する代わりに、各ページの「残すべきアノテーション
      // 参照配列」を用意しておく。まず本ツール由来（/NMが"WT-"）のものを全ページから
      // 取り除いておくことで、今回対象外のページ（このファイルに項目が無いページ）に
      // 残っていた過去の描画も含めて確実にクリーンアップされる（＝焼き付き防止）。
      const pageAnnotRefs = pages.map(page => keepNonToolAnnotRefs(doc.context, page));

      for (const a of fileAnnots){
        const localPage = a.page - pf.offset;
        const page = pages[localPage];
        const refs = pageAnnotRefs[localPage];
        const rotAngle = page.getRotation().angle || 0;
        const col = a.voided ? rgb(0.6,0.6,0.6) : hexToRgb(a.color);

        if (a.kind === "comment") continue; // コメントは非印刷メモのためPDFには一切書き出さない

        if (isPathKind(a.kind)){
          // 引き出し線／フリーハンド／四角形・円楕円・三角形の輪郭（区間ごとに1本のLineアノテーションとして保存）
          const pts = shapeBoundaryPoints(a);
          for (let k=0;k<pts.length-1;k++){
            const [x1,y1]=pts[k], [x2,y2]=pts[k+1];
            refs.push(buildLineAnnot(doc, {x1,y1,x2,y2,lw:a.lw,col}));
          }
          continue;
        }
        if (a.points && a.points.length){
          // 溶接番号／テキスト注記に付随する引き出し線
          const full = [...a.points, [a.x, a.y]];
          for (let k=0;k<full.length-1;k++){
            const [x1,y1]=full[k], [x2,y2]=full[k+1];
            refs.push(buildLineAnnot(doc, {x1,y1,x2,y2,lw:a.lw,col}));
          }
          if (a.kind === "arrow_text"){
            // 矢印付き文字：線の先端(a.points[0])に矢じるし(V字2本線)を追加
            const tip = full[0], from = full[1];
            const size = Math.max(6, a.fs*0.5);
            arrowHeadSegments(tip[0],tip[1], from[0],from[1], size).forEach(([[x1,y1],[x2,y2]])=>{
              refs.push(buildLineAnnot(doc, {x1,y1,x2,y2,lw:a.lw,col}));
            });
          }
        }
        if (a.kind === "weld"){
          // 円（Circleアノテーション。欠番の斜線も同じオブジェクトに含める）
          refs.push(buildCircleAnnot(doc, { x:a.x, y:a.y, r:a.r, lw:a.lw, col, voided:a.voided, rotAngle }));
          // 番号の文字（円と対になるFreeTextアノテーション。枠なし）
          const label = String(a.number);
          const font = pickFont(a, label);
          try{
            refs.push(buildFreeTextAnnot(doc, { x:a.x, y:a.y, text:label, fs:a.fs, font, col, rotAngle, box:false }));
          }catch(err){
            warnings.push(`${pf.name}: 番号 ${label} の描画に失敗しました（${err.message}）`);
          }
        } else if (a.kind === "text"){
          // テキスト追加は番号追加と同じ丸（Circleアノテーション＋枠なしFreeText）で出力する
          const font = pickFont(a, a.text);
          const rr2 = Math.max(a.r, font.widthOfTextAtSize(String(a.text), a.fs)/2+6);
          refs.push(buildCircleAnnot(doc, { x:a.x, y:a.y, r:rr2, lw:a.lw, col, voided:a.voided, rotAngle }));
          try{
            refs.push(buildFreeTextAnnot(doc, { x:a.x, y:a.y, text:a.text, fs:a.fs, font, col, rotAngle, box:false }));
          }catch(err){
            warnings.push(`${pf.name}: テキスト「${a.text}」の描画に失敗しました（${err.message}）`);
          }
        } else {
          // それ以外（矢印付き文字など）は従来通り白背景の矩形＋枠線＋文字
          const font = pickFont(a, a.text);
          try{
            refs.push(buildFreeTextAnnot(doc, { x:a.x, y:a.y, text:a.text, fs:a.fs, font, col, rotAngle, box:true, voided:a.voided }));
          }catch(err){
            warnings.push(`${pf.name}: テキスト「${a.text}」の描画に失敗しました（${err.message}）`);
          }
        }
      }

      // 各ページの最終的なAnnots配列を反映する（保持分＋今回生成分）。
      // これにより、ページ内容(コンテンツストリーム)には一切手を加えず、
      // アノテーションの追加・入れ替えだけで保存が完結するため、
      // 何度保存を繰り返しても古い図形が残ったり重複したりしない。
      pages.forEach((page, idx) => {
        page.node.set(PDFName.of("Annots"), doc.context.obj(pageAnnotRefs[idx]));
      });

      // 次回このツールで開いたときに番号やテキストを再編集できるよう、
      // このファイルに属するアノテーション情報をPDF内に埋め込んでおく
      // （ページ番号はファイル内でのローカル番号に変換して保存する）
      const dataPayload = JSON.stringify({
        v:1,
        annots: fileAnnots.map(a2=>({...a2, page: a2.page - pf.offset})),
      });
      doc.catalog.set(PDFName.of("WeldToolData"), PDFHexString.fromText(dataPayload));

      const outBytes = await doc.save();
      const blob = new Blob([outBytes], {type:"application/pdf"});
      const suggestedName = nameFor(pf);
      downloadBlob(blob, suggestedName);
      savedNames.push(suggestedName);
      savedCount++;
      // 複数ファイルを連続ダウンロードする際、ブラウザにブロックされにくいよう少し間隔を空ける
      await new Promise(r=>setTimeout(r, 400));
    }
    const savedList = savedNames.length<=3
      ? savedNames.join("、")
      : `${savedNames.slice(0,3).join("、")} 他${savedNames.length-3}件`;
    if (warnings.length){
      setStatus(`保存が完了しました（${savedCount} 個 / ブラウザの「ダウンロード」フォルダへ保存: ${savedList}）。ただし一部警告あり: ${warnings[0]}${warnings.length>1?` 他${warnings.length-1}件`:""}`);
      console.warn(warnings);
    } else {
      setStatus(`保存が完了しました。ブラウザの「ダウンロード」フォルダへ保存: ${savedList}`);
    }
    isDirty = false;
  }catch(err){
    console.error(err);
    setStatus("保存中にエラーが発生しました: "+err.message);
  }
}

document.getElementById("btnSave").onclick = ()=> saveFiles(pdfFiles);
document.getElementById("btnSaveSelectedFiles").onclick = ()=>{
  const targets = pdfFiles.filter(pf=>pf.selected);
  if (!targets.length){ setStatus("保存するPDFにチェックを入れてください"); return; }
  saveFiles(targets);
};

/* ===================== 離脱時の未保存確認 ===================== */
window.addEventListener("beforeunload", e=>{
  if (isDirty){
    e.preventDefault();
    e.returnValue = "";
  }
});

function hexToRgb(hex){
  hex = hex.replace("#","");
  const r = parseInt(hex.substring(0,2),16)/255;
  const g = parseInt(hex.substring(2,4),16)/255;
  const b = parseInt(hex.substring(4,6),16)/255;
  return rgb(r,g,b);
}

/* ===================== ライセンスキー確認 ===================== */
// ★有効なライセンスキーはここに追加・削除してください（複数登録可）。
//   この配列からキーを外してファイルを更新すると、そのキーを使っている人は
//   次回アクセス時（6か月を待たずに）再入力を求められます。
var LICENSE_KEYS = ['17341'];
// 何日ごとに再入力を求めるか（約6か月=183日）
var LICENSE_PERIOD_DAYS = 183;
var LICENSE_STORAGE_KEY = 'weldtool_license_v1';

function licenseStorageGet(){
  try{ return JSON.parse(localStorage.getItem(LICENSE_STORAGE_KEY) || 'null'); }
  catch(e){ return null; }
}
function licenseStorageSet(obj){
  try{ localStorage.setItem(LICENSE_STORAGE_KEY, JSON.stringify(obj)); }
  catch(e){ /* 保存できない環境では毎回キー入力を求める形になる */ }
}
// 初回起動時はfirstUsedAtだけを記録し、キー入力なしで使い始められる。
// キー入力済みならverifiedAtから、未入力（初回猶予中）ならfirstUsedAtから
// LICENSE_PERIOD_DAYS日が経過するまではゲートを表示しない。
function isWithinGracePeriod(rec){
  if(!rec) return false;
  var now = Date.now();
  if(rec.key){
    if(LICENSE_KEYS.indexOf(rec.key) === -1) return false; // キーが失効/削除された
    var elapsedSinceVerify = (now - rec.verifiedAt) / 86400000;
    return elapsedSinceVerify < LICENSE_PERIOD_DAYS;
  }
  var elapsedSinceFirstUse = (now - rec.firstUsedAt) / 86400000;
  return elapsedSinceFirstUse < LICENSE_PERIOD_DAYS;
}
function showLicenseGate(onSuccess){
  var overlay = document.getElementById('licenseOverlay');
  var input   = document.getElementById('licenseKeyField');
  var errEl   = document.getElementById('licenseError');
  var btn     = document.getElementById('licenseConfirmBtn');
  errEl.style.display = 'none';
  input.value = '';
  overlay.classList.add('vis');
  function tryConfirm(){
    var v = input.value.trim();
    if(LICENSE_KEYS.indexOf(v) !== -1){
      licenseStorageSet({key:v, verifiedAt:Date.now()});
      overlay.classList.remove('vis');
      onSuccess();
    } else {
      errEl.style.display = 'block';
      input.select();
    }
  }
  btn.onclick = tryConfirm;
  input.onkeydown = function(e){ if(e.key==='Enter') tryConfirm(); };
  setTimeout(function(){ input.focus(); }, 150);
}
function bootWithLicenseCheck(startFn){
  var rec = licenseStorageGet();
  if(!rec){
    // 初回起動：キー入力なしでそのまま使える。起動日時だけ記録する。
    licenseStorageSet({firstUsedAt:Date.now()});
    startFn();
    return;
  }
  if(isWithinGracePeriod(rec)){ startFn(); }
  else { showLicenseGate(startFn); }
}
bootWithLicenseCheck(function(){});
renderAnnotList();
